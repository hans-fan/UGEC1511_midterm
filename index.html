<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Economics MCQ Practice — 310 Questions</title>
<style>
  :root{
    --bg:#f2f6fb; --card:#ffffff; --ink:#16202b; --muted:#63748a;
    --accent:#2563eb; --accent2:#0d9488; --ok:#15803d; --bad:#b91c1c;
    --line:#dde5ef; --soft:#eef3fa;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  .app{max-width:900px;margin:0 auto;padding:26px 16px 70px}
  header{text-align:center;margin-bottom:20px}
  h1{font-size:1.65rem;margin:0 0 6px;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:.95rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 10px 30px rgba(20,40,80,.06)}
  .hidden{display:none !important}
  .muted{color:var(--muted)}

  /* start screen */
  .topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:18px}
  .topic-btn{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:.15s;font:inherit;color:inherit}
  .topic-btn:hover{background:#e3edfb;border-color:#b9cfee;transform:translateY(-1px)}
  .topic-btn span{font-weight:700}
  .topic-btn small{color:var(--muted)}
  .start-options{display:flex;align-items:center;gap:8px;margin-top:18px;color:var(--muted);font-size:.92rem}
  .start-options input{width:17px;height:17px;accent-color:var(--accent)}

  /* quiz */
  .quiz-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .pill{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.82rem;color:var(--muted);font-weight:600}
  .pill strong{color:var(--ink)}
  .exit-btn{background:none;border:none;color:var(--muted);cursor:pointer;font:inherit;font-size:.88rem;text-decoration:underline}
  .progress{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin:12px 0 20px}
  .progress > div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .25s ease}
  .q-text{font-size:1.12rem;font-weight:650;margin:0 0 16px}
  .options{display:flex;flex-direction:column;gap:10px}
  .option{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:12px 14px;cursor:pointer;font:inherit;color:inherit;transition:.12s}
  .option:hover:not(:disabled){border-color:#9db9e8;background:#f8fbff}
  .option:disabled{cursor:default}
  .option .key{flex:0 0 26px;height:26px;border-radius:7px;background:var(--soft);display:grid;place-items:center;font-weight:700;font-size:.8rem;color:var(--muted)}
  .option.correct{border-color:var(--ok);background:#f0fdf4}
  .option.correct .key{background:var(--ok);color:#fff}
  .option.wrong{border-color:var(--bad);background:#fef2f2}
  .option.wrong .key{background:var(--bad);color:#fff}
  .feedback{margin-top:16px;border-radius:12px;padding:14px 16px;border:1px solid;animation:fade .2s ease}
  @keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
  .feedback.ok{background:#f0fdf4;border-color:#bbf7d0}
  .feedback.bad{background:#fef2f2;border-color:#fecaca}
  .fb-title{font-weight:800;margin-bottom:4px}
  .feedback.ok .fb-title{color:var(--ok)}
  .feedback.bad .fb-title{color:var(--bad)}
  .fb-body{font-size:.95rem}
  .actions{display:flex;justify-content:flex-end;margin-top:16px}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px 20px;font:inherit;font-weight:650;cursor:pointer;transition:.15s}
  .btn:hover{filter:brightness(1.07)}
  .btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
  .btn.small{padding:8px 14px;font-size:.9rem}

  /* results */
  .score-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-bottom:8px}
  .score-circle{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) 0deg,#e6eef9 0deg);position:relative}
  .score-circle::after{content:"";position:absolute;inset:9px;background:#fff;border-radius:50%}
  .score-circle span{position:relative;z-index:1;font-size:1.5rem;font-weight:800}
  .score-meta h2{margin:0 0 4px}
  .review{margin-top:22px;display:flex;flex-direction:column;gap:12px}
  .review-item{border:1px solid var(--line);border-radius:12px;padding:13px 15px;background:#fbfdff}
  .review-q{font-weight:650;margin-bottom:7px}
  .review-line{font-size:.92rem;margin:2px 0}
  .tag{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:6px;margin-right:5px}
  .tag.ok{background:#dcfce7;color:var(--ok)}
  .tag.bad{background:#fee2e2;color:var(--bad)}
  .review-exp{font-size:.9rem;color:var(--muted);margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
  .result-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Economics MCQ Practice</h1>
    <div class="sub">310 interactive questions · Inflation &amp; CPI · Unemployment · GDP · iBonds</div>
  </header>

  <!-- START -->
  <main id="start-screen" class="card">
    <h2 style="margin-top:0">Choose a topic</h2>
    <p class="muted" style="margin-top:4px">Each answer comes with an explanation drawn from the lecture notes.</p>
    <div class="topics" id="topicGrid"></div>
    <label class="start-options"><input type="checkbox" id="shuffle"> Shuffle question order</label>
  </main>

  <!-- QUIZ -->
  <main id="quiz-screen" class="card hidden">
    <div class="quiz-top">
      <div class="pill" id="topicBadge">Topic</div>
      <div class="pill">Score: <strong id="scoreVal">0</strong></div>
      <div class="pill" id="qCounter">Question</div>
      <button class="exit-btn" onclick="show('start')">Exit</button>
    </div>
    <div class="progress"><div id="progressBar"></div></div>
    <h2 class="q-text" id="questionText"></h2>
    <div class="options" id="options"></div>
    <div id="feedback" class="feedback hidden"></div>
    <div class="actions"><button class="btn hidden" id="nextBtn" onclick="next()">Next</button></div>
  </main>

  <!-- RESULTS -->
  <main id="result-screen" class="card hidden">
    <div class="score-wrap">
      <div class="score-circle" id="scoreCircle"><span id="finalPct">0%</span></div>
      <div class="score-meta">
        <h2 id="finalScore">0 / 0</h2>
        <p class="muted" id="finalMsg"></p>
      </div>
    </div>
    <h3 style="margin-bottom:6px">Review incorrect answers</h3>
    <div class="review" id="review"></div>
    <div class="result-actions">
      <button class="btn" onclick="startQuiz(state.topic)">Restart this topic</button>
      <button class="btn ghost" id="retryWrong" onclick="retryWrong()">Retry incorrect only</button>
      <button class="btn ghost" onclick="show('start')">Change topic</button>
    </div>
  </main>
</div>

<script>
/* ============================================================
   QUESTION BANK
   Format: [question, [4 options], correctIndex, explanation, topic]
   ============================================================ */
const QUESTIONS = [
/* ================= INFLATION & CPI (Lecture 1) — 100 questions ================= */
["Inflation is defined as:",["A sustained rise in the economy's overall price level","A rise in the price of one specific good","A fall in the overall price level","A rise in nominal wages"],0,"Inflation is a situation in which the economy's overall price level is rising, not just the price of one good.","inflation"],
["The inflation rate is:",["The percentage change in the price level from the previous period","The change in food and energy prices","The percentage change in nominal GDP","The gap between nominal and real interest rates"],0,"The inflation rate is the percentage change in the price level from the previous period.","inflation"],
["The Consumer Price Index (CPI) measures:",["The cost of a standard basket of goods and services relative to its cost in a base year","The prices of all goods produced domestically","The cost of capital goods bought by firms","The growth of the money supply"],0,"The CPI measures the cost in a period of a standard basket relative to the cost of the same basket in a fixed base year.","inflation"],
["The CPI formula is:",["Cost of base-year basket in current year / Cost of base-year basket in base year","Cost of current basket in current year / Cost of current basket in base year","Nominal GDP / Real GDP","Cost of base-year basket in base year / Cost of base-year basket in current year"],0,"CPI = cost of the base-year basket in the current year divided by its cost in the base year.","inflation"],
["In the CPI, the base year is assigned a value of:",["1.00 (or 100)","0","10","It depends on the inflation rate"],0,"By construction the CPI equals 1.00 (or 100) in the base year.","inflation"],

["In 2019 the same basket costs rent $630, 60 hamburgers at $2.50, 10 movie tickets at $7. Total expenditure is:",["$850","$800","$680","$920"],0,"$630 + $150 + $70 = $850.","inflation"],
["If the 2014 basket costs $680 and the same basket costs $850 in 2019, the CPI in 2019 is:",["1.25","1.20","0.80","1.85"],0,"CPI = 850/680 = 1.25.","inflation"],
["A CPI of 1.25 in 2019 (base 2014) means the cost of living:",["Rose by 25% between 2014 and 2019","Rose by 125% between 2014 and 2019","Fell by 25% between 2014 and 2019","Was unchanged"],0,"The cost of the basket increased by 25% (1.25 − 1.00 = 0.25).","inflation"],
["In Hong Kong, the CPI is constructed by:",["The Census and Statistics Department","The Hong Kong Monetary Authority","The Treasury","The Stock Exchange of Hong Kong"],0,"The Census and Statistics Department constructs the CPI.","inflation"],
["Which is the first step in constructing the CPI?",["Pick a base year","Measure current prices","Calculate the inflation rate","Adjust for quality changes"],0,"Construction starts by picking a base year, then conducting the Household Expenditure Survey.","inflation"],
["The Household Expenditure Survey is used to:",["Determine the base-year basket of goods and services","Measure the money supply","Calculate real GDP","Set interest rates"],0,"The survey determines the base-year basket of goods and services.","inflation"],
["The inflation rate between Year 1 and Year 2 is calculated as:",["(CPI2 − CPI1) / CPI1 × 100","(CPI1 − CPI2) / CPI2 × 100","CPI2 / CPI1 × 100","(CPI2 + CPI1) / 2 × 100"],0,"Inflation rate = (CPI in Year 2 − CPI in Year 1) / CPI in Year 1 × 100.","inflation"],
["If CPI rises from 0.418 to 0.444, the inflation rate is approximately:",["6.2%","2.6%","4.4%","11.0%"],0,"(0.444 − 0.418)/0.418 = 0.062 = 6.2%.","inflation"],
["If CPI rises from 0.444 to 0.493, the inflation rate is approximately:",["11.0%","6.2%","4.9%","1.1%"],0,"(0.493 − 0.444)/0.444 = 0.110 = 11.0%.","inflation"],
["If CPI falls from 0.171 to 0.167, the inflation rate is approximately:",["−2.3%","2.3%","−0.4%","−4.0%"],0,"(0.167 − 0.171)/0.171 = −0.023 = −2.3%.","inflation"],
["If CPI falls from 0.167 to 0.152, the inflation rate is approximately:",["−9.0%","−1.5%","9.0%","−15%"],0,"(0.152 − 0.167)/0.167 = −0.090 = −9.0%.","inflation"],
["Deflation is:",["A situation in which prices of most goods and services are falling over time","A fall in the price of one good","A rise in unemployment","A fall in nominal GDP"],0,"Deflation occurs when prices of most goods and services fall so that inflation is negative.","inflation"],
["A nominal quantity is:",["A quantity measured in terms of its current dollar value","A quantity measured in physical terms","A quantity adjusted for inflation","A quantity measured in base-year prices"],0,"A nominal quantity is measured in terms of its current dollar value.","inflation"],
["A real quantity is:",["A quantity measured in physical terms, such as quantities of goods and services","A quantity measured in current dollars","A quantity that always rises with inflation","The same as a nominal quantity"],0,"A real quantity is measured in physical terms — for example, quantities of goods and services.","inflation"],
["Deflating a nominal quantity means:",["Dividing it by a price index to express it in real terms","Multiplying it by the CPI","Adding the inflation rate to it","Subtracting the CPI from it"],0,"Deflating divides a nominal quantity by a price index to express it in real terms.","inflation"],
["A family earned $20,000 in 2014 when CPI = 1.00. Its real income in 2014 is:",["$20,000","$22,000","$17,600","$25,000"],0,"$20,000/1.00 = $20,000.","inflation"],

["Real income fell from $20,000 to $17,600. This means purchasing power:",["Fell by 12%","Rose by 12%","Was unchanged","Fell by 25%"],0,"Real income fell by $2,400, which is 12% of $20,000.","inflation"],

["The purpose of indexing is to:",["Prevent the purchasing power of a nominal quantity from being eroded by inflation","Increase nominal GDP","Reduce the inflation rate","Keep nominal interest rates constant"],0,"Indexing prevents the purchasing power of the nominal quantity from being eroded by inflation.","inflation"],
["A Social Security payment is $1,000/month in 2014. If it is indexed to inflation of 20% by 2019, the 2019 payment is:",["$1,200/month","$1,020/month","$1,000/month","$800/month"],0,"$1,000 × 1.20 = $1,200.","inflation"],
["An indexed labor contract pays $12/hr in Year 1 (CPI = 1.00). The real wage is to rise 2% in Year 2 (CPI = 1.05). The Year 2 nominal wage is about:",["$12.85","$12.24","$12.60","$13.73"],0,"Real wage Year 2 = $12 × 1.02 = $12.24; nominal = $12.24 × 1.05 = $12.852 ≈ $12.85.","inflation"],

["The two causes of CPI overestimation of inflation are:",["Quality adjustment bias and substitution bias","Deflation and disinflation","Shoe-leather costs and noise","Bracket creep and indexing"],0,"The slides identify quality adjustment bias and substitution bias.","inflation"],
["Quality adjustment bias occurs when:",["Price increases partly reflect improved quality that the CPI does not fully account for","Consumers substitute cheaper goods","The basket is updated every year","The base year is changed"],0,"If higher prices partly reflect better quality, the CPI overstates the true rise in the cost of living.","inflation"],
["Substitution bias occurs when:",["Consumers substitute away from goods whose prices rise, but the CPI keeps a fixed basket","The quality of goods improves","The base year is updated","Prices fall over time"],0,"Because the CPI uses a fixed basket, it ignores substitution toward cheaper alternatives and overstates inflation.","inflation"],

["Using the fixed basket, measured inflation from 2014 to 2019 is:",["50%","25%","100%","20%"],0,"$300/$200 = 1.50, so 50% inflation.","inflation"],
["If consumers substitute (0 coffee, 100 tea, 100 scones) in 2019, the basket costs:",["$250","$300","$200","$275"],0,"0 + 100×$1 + 100×$1.50 = $250.","inflation"],
["With substitution, measured inflation is:",["25%","50%","0%","30%"],0,"$250/$200 = 1.25, or 25% inflation.","inflation"],
["The difference between 50% and 25% illustrates:",["Substitution bias","Quality adjustment bias","Deflation","Bracket creep"],0,"The fixed basket overstates inflation because it ignores substitution toward cheaper goods.","inflation"],
["The GDP deflator is calculated as:",["Nominal GDP / Real GDP × 100","Real GDP / Nominal GDP × 100","CPI / Nominal GDP × 100","Nominal GDP × Real GDP"],0,"GDP deflator = Nominal GDP / Real GDP × 100.","inflation"],
["The GDP deflator reflects the prices of:",["All goods and services produced domestically","Only goods and services bought by consumers","Only imported goods","Only capital goods"],0,"The GDP deflator reflects prices of all goods and services produced domestically.","inflation"],
["The CPI reflects the prices of:",["All goods and services bought by consumers","All goods produced domestically","Only investment goods","Only exports"],0,"The CPI reflects prices of all goods and services bought by consumers.","inflation"],
["A key difference between CPI and GDP deflator is:",["CPI uses a fixed basket while the GDP deflator compares currently produced goods","CPI covers producer goods while the deflator covers consumer goods","The GDP deflator is always larger","The CPI is not a price index"],0,"The CPI compares a fixed basket over time; the GDP deflator compares currently produced goods to base-year prices.","inflation"],
["The price level is:",["A measure of the overall level of prices at a point in time","The price of one specific good","The rate of change of prices","The ratio of two specific prices"],0,"The price level measures the overall level of prices at a particular point in time, as measured by a price index such as the CPI.","inflation"],
["A relative price is:",["The price of a specific good compared with prices of other goods","The overall price level","The inflation rate","The real interest rate"],0,"A relative price is the price of a specific good or service compared with prices of other goods and services.","inflation"],
["Which statement is true?",["Changes in relative prices do not necessarily imply significant inflation","Any relative price change is inflation","Inflation always changes relative prices","Relative prices and the price level are the same"],0,"Changes in relative prices do not necessarily imply a significant amount of inflation.","inflation"],
["Inflation can be high:",["Without affecting relative prices","Only if all relative prices change","Only during deflation","Only if the CPI falls"],0,"Inflation can be high without affecting relative prices.","inflation"],
["To counteract relative price changes, government policy would have to:",["Affect the market for specific goods","Use monetary and fiscal policy","Change the CPI base year","Reduce the money supply"],0,"Counteracting relative price changes requires policies affecting specific goods markets.","inflation"],
["To counteract inflation, the government must use:",["Monetary and fiscal policy","Price controls on one good","A new base year","Quality adjustments"],0,"To counteract inflation, the government must use monetary and fiscal policy.","inflation"],
["Shoe-leather costs are:",["The resources used to economize on holding cash during high inflation","The cost of shoes in the CPI basket","Losses from unexpected inflation","Tax distortions caused by inflation"],0,"Shoe-leather costs are the use of resources to economize on holding cash during periods of high inflation.","inflation"],
["Noise in the price system refers to:",["Inflation obscuring the information transmitted by prices","Loud advertising","Statistical errors in the CPI","Changes in relative prices"],0,"Inflation obscures price information and reduces the efficiency of the market system.","inflation"],
["Bracket creep is a distortion of:",["The tax system","The CPI basket","The labor market","The bond market"],0,"Inflation can push people into higher tax brackets — a tax-system distortion known as bracket creep.","inflation"],

/* ============================================================
   APP LOGIC
   ============================================================ */
const TOPICS = {inflation:"Inflation & CPI", unemployment:"Unemployment", gdp:"GDP", ibonds:"iBonds"};

const state = { list:[], i:0, score:0, answered:false, wrong:[], topic:"all" };

function byTopic(t){ return t==="all" ? QUESTIONS.slice() : QUESTIONS.filter(q=>q[4]===t); }

function shuffle(a){
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
}

function init(){
  const wrap=document.getElementById("topicGrid");
  const counts={};
  QUESTIONS.forEach(q=>counts[q[4]]=(counts[q[4]]||0)+1);
  const items=[["all","All Topics",QUESTIONS.length]].concat(Object.keys(TOPICS).map(k=>[k,TOPICS[k],counts[k]||0]));
  wrap.innerHTML=items.map(([k,name,n])=>
    `<button class="topic-btn" onclick="startQuiz('${k}')"><span>${name}</span><small>${n} questions</small></button>`
  ).join("");
}

function show(id){
  ["start","quiz","result"].forEach(s=>document.getElementById(s+"-screen").classList.toggle("hidden", s!==id));
  window.scrollTo({top:0,behavior:"smooth"});
}

function startQuiz(topic){
  let list=byTopic(topic);
  if(document.getElementById("shuffle").checked) shuffle(list);
  launch(list,topic);
}

function launch(list,topic){
  state.list=list; state.topic=topic; state.i=0; state.score=0; state.answered=false; state.wrong=[];
  show("quiz");
  render();
}

function render(){
  const q=state.list[state.i];
  state.answered=false;
  document.getElementById("topicBadge").textContent=TOPICS[q[4]]||"Mixed";
  document.getElementById("qCounter").textContent=`Question ${state.i+1} of ${state.list.length}`;
  document.getElementById("scoreVal").textContent=state.score;
  document.getElementById("progressBar").style.width=(state.i/state.list.length*100)+"%";
  document.getElementById("questionText").textContent=q[0];

  const opts=document.getElementById("options");
  opts.innerHTML="";
  q[1].forEach((text,idx)=>{
    const b=document.createElement("button");
    b.className="option";
    b.innerHTML=`<span class="key">${"ABCD"[idx]}</span><span>${text}</span>`;
    b.onclick=()=>select(idx);
    opts.appendChild(b);
  });

  const fb=document.getElementById("feedback");
  fb.className="feedback hidden";
  fb.innerHTML="";
  document.getElementById("nextBtn").classList.add("hidden");
}

function select(idx){
  if(state.answered) return;
  state.answered=true;
  const q=state.list[state.i];
  const btns=[...document.querySelectorAll(".option")];
  btns.forEach((b,i)=>{
    b.disabled=true;
    if(i===q[2]) b.classList.add("correct");
    if(i===idx && idx!==q[2]) b.classList.add("wrong");
  });
  const ok=idx===q[2];
  if(ok) state.score++; else state.wrong.push({q,chosen:idx});
  document.getElementById("scoreVal").textContent=state.score;

  const fb=document.getElementById("feedback");
  fb.className="feedback "+(ok?"ok":"bad");
  fb.innerHTML=`<div class="fb-title">${ok?"Correct!":"Incorrect"}</div>
    <div class="fb-body">${ok?"":`<b>Correct answer:</b> ${q[1][q[2]]}<br>`}${q[3]}</div>`;

  const nb=document.getElementById("nextBtn");
  nb.textContent = state.i===state.list.length-1 ? "See Results" : "Next Question";
  nb.classList.remove("hidden");
  nb.focus();
}

function next(){
  if(!state.answered) return;
  if(state.i<state.list.length-1){ state.i++; render(); }
  else results();
}

function results(){
  show("result");
  const total=state.list.length;
  const pct=Math.round(state.score/total*100);
  document.getElementById("finalScore").textContent=`${state.score} / ${total}`;
  document.getElementById("finalPct").textContent=pct+"%";
  document.getElementById("scoreCircle").style.background=`conic-gradient(var(--accent) ${pct*3.6}deg,#e6eef9 0deg)`;
  document.getElementById("finalMsg").textContent =
    pct>=80?"Excellent work — you have mastered the material." :
    pct>=60?"Good job. Review the explanations and try again to improve." :
    "Keep practising. Read the explanations carefully and retry.";

  const rev=document.getElementById("review");
  if(state.wrong.length===0){
    rev.innerHTML="<p class='muted'>No incorrect answers. Perfect run!</p>";
  } else {
    rev.innerHTML=state.wrong.map((w,i)=>`
      <div class="review-item">
        <div class="review-q">${i+1}. ${w.q[0]}</div>
        <div class="review-line"><span class="tag bad">Your answer</span>${w.q[1][w.chosen]}</div>
        <div class="review-line"><span class="tag ok">Correct</span>${w.q[1][w.q[2]]}</div>
        <div class="review-exp">${w.q[3]}</div>
      </div>`).join("");
  }
  document.getElementById("retryWrong").classList.toggle("hidden",state.wrong.length===0);
}

function retryWrong(){
  const list=state.wrong.map(w=>w.q);
  const topic=state.topic;
  launch(list,topic);
}

/* keyboard: 1-4 to answer, Enter for next */
document.addEventListener("keydown",e=>{
  if(document.getElementById("quiz-screen").classList.contains("hidden")) return;
  if(["1","2","3","4"].includes(e.key)){
    const i=+e.key-1;
    const btns=document.querySelectorAll(".option");
    if(btns[i] && !btns[i].disabled) select(i);
  }
  if(e.key==="Enter" && !document.getElementById("nextBtn").classList.contains("hidden")) next();
});

init();
</script>
