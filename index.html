/* ---------------- LECTURE 1 : INFLATION & PRICE MEASUREMENT ---------------- */
{t:"L1",q:"Inflation is best defined as:",o:["a one-time increase in the price of a single good","a sustained situation in which the economy's overall price level is rising","an increase in the money supply only","a fall in the unemployment rate"],a:1,e:"Inflation is a situation in which the economy's overall price level is rising — not just one good's price."},

{t:"L1",q:"Deflation occurs when:",o:["the inflation rate is positive but falling","prices of most goods and services fall over time so that inflation is negative","the CPI is unchanged","the GDP deflator is 100"],a:1,e:"Deflation = prices of most goods and services falling over time, i.e. negative inflation."},

{t:"L1",q:"The CPI in the base year is 1.00 because:",o:["prices are zero","the basket is empty","inflation is zero","the numerator and denominator are equal"],a:3,e:"The base-year basket cost appears in both numerator and denominator."},

{t:"L1",q:"Quality adjustment bias arises because:",o:["consumers substitute cheaper goods","a higher price may partly reflect improved quality, which the CPI may miss","the basket is updated too often","imports are excluded"],a:1,e:"Missing quality improvement overstates the pure price increase."},

{t:"L1",q:"Noise in the price system makes it harder for consumers and firms to:",o:["identify relative price changes","pay taxes","hold cash","buy bonds"],a:0,e:"Relative price signals become harder to read."},
{t:"L1",q:"Inflation can distort incentives to work, save and invest through:",o:["quality adjustment","substitution bias","indexing","tax distortions such as bracket creep"],a:3,e:"Bracket creep and depreciation allowances distort incentives."},
{t:"L1",q:"Uncertainty about future inflation mainly affects:",o:["retirement and investment planning","the size of the labor force","the definition of GDP","the value-added method"],a:0,e:"Greater uncertainty interferes with long-run planning."},

/* ---------------- LECTURE 1 : INTEREST RATES ---------------- */
{t:"L1",q:"The nominal interest rate is:",o:["the annual percentage increase in the purchasing power of an asset","the annual percentage increase in the nominal value of a financial asset","the inflation rate","the real interest rate plus the GDP deflator"],a:1,e:"Nominal (market) rate = annual % increase in the nominal value of the asset."},
{t:"L1",q:"The real interest rate is:",o:["the annual percentage increase in the purchasing power of a financial asset","the market interest rate","equal to the nominal rate plus inflation","the CPI"],a:0,e:"Real rate = annual % increase in purchasing power."},
{t:"L1",q:"The Fisher equation used in the lecture is:",o:["r = i + π","r = i − π","i = r − π","π = i + r"],a:1,e:"Real rate ≈ nominal rate − inflation rate."},
{t:"L1",q:"If the nominal rate is 4% and inflation is 1%, the approximate real rate is:",o:["5%","3%","4%","1%"],a:1,e:"4% − 1% = 3%."},
{t:"L1",q:"If the nominal rate is 4% and expected inflation is 3%, the expected real rate is:",o:["7%","1%","−1%","3%"],a:1,e:"4% − 3% = 1%."},
{t:"L1",q:"A $20,000 one-year deposit at a 4% nominal rate pays at maturity:",o:["$20,800","$20,000","$20,400","$21,200"],a:0,e:"20,000 × 1.04 = $20,800."},
{t:"L1",q:"With actual inflation of 1% instead of the expected 3%, the depositor:",o:["loses relative to expectations","gains relative to expectations because the real return is higher","is unaffected","faces deflation"],a:1,e:"Lower-than-expected inflation gives a higher real return to the lender."},
{t:"L1",q:"Under a fixed nominal contract, unexpectedly high inflation benefits:",o:["lenders and workers","borrowers and employers","lenders and employers","nobody"],a:1,e:"Borrowers and employers gain; lenders and workers lose."},
{t:"L1",q:"Expected inflation may not hurt lenders because:",o:["they can adjust nominal interest rates","inflation is zero","real rates are fixed by law","the CPI is fixed"],a:0,e:"Lenders can build expected inflation into the nominal rate."},
{t:"L1",q:"The lecture treats r = i − π as:",o:["an exact identity","an approximation for real returns","the inflation rate","the GDP deflator"],a:1,e:"It is an approximation of the real return."},
{t:"L1",q:"If the nominal interest rate is 6% and inflation is 6%, the approximate real rate is:",o:["12%","0%","6%","−6%"],a:1,e:"6% − 6% = 0%."},
{t:"L1",q:"If the nominal rate is 2% and inflation is 5%, the approximate real rate is:",o:["7%","3%","−3%","−7%"],a:2,e:"2% − 5% = −3%."},
{t:"L1",q:"Nominal interest rates are also called:",o:["market interest rates","real interest rates","inflation rates","discount rates"],a:0,e:"The nominal rate is the market interest rate."},
{t:"L1",q:"If the real interest rate is 2% and inflation is 3%, the nominal rate is approximately:",o:["5%","1%","6%","−1%"],a:0,e:"i ≈ r + π = 2% + 3% = 5%."},
{t:"L1",q:"Unexpected inflation hurts:",o:["borrowers","lenders with fixed nominal contracts","employers","debtors"],a:1,e:"Lenders with fixed nominal contracts lose purchasing power."},
{t:"L1",q:"The Fisher equation describes the link between:",o:["nominal rates, real rates and inflation","the CPI and the GDP deflator","output and unemployment","exports and imports"],a:0,e:"It links nominal interest, real interest and inflation."},
{t:"L1",q:"Inflation that is fully expected is less harmful to lenders because:",o:["they can build it into nominal interest rates","real rates become negative","the CPI is fixed","borrowers refuse to pay"],a:0,e:"Expected inflation can be priced into the nominal rate."},

/* ---------------- LECTURE 1 : iBONDS ---------------- */
{t:"L1",q:"An iBond is:",o:["an inflation-linked retail bond issued by the HKSAR Government","a corporate bond issued by banks","a foreign currency deposit","a share listed on the SEHK"],a:0,e:"iBonds are inflation-linked retail bonds under the Government Bond Programme."},
{t:"L1",q:"The first iBond series was issued in:",o:["January 2020","July 2008","March 2015","July 2011"],a:3,e:"The first series was issued in July 2011."},
{t:"L1",q:"The minimum denomination of an iBond is:",o:["HK$1,000","HK$10,000","HK$100,000","HK$50,000"],a:1,e:"Minimum denomination is HK$10,000."},
{t:"L1",q:"The term of an iBond is:",o:["one year","two years","three years","five years"],a:2,e:"iBonds have a three-year term."},
{t:"L1",q:"iBond interest is paid:",o:["once a year","twice a year","monthly","at maturity only"],a:1,e:"Interest is paid twice a year."},
{t:"L1",q:"The iBond principal is repaid at maturity at:",o:["100%","par plus accumulated inflation","the prevailing CPI","the floating rate"],a:0,e:"The government repays 100% of principal at maturity."},
{t:"L1",q:"iBonds can be:",o:["only held to maturity","redeemed only by the HKMA","converted into equity","traded on the Stock Exchange of Hong Kong"],a:3,e:"iBonds can be traded on the SEHK."},
{t:"L1",q:"The iBond floating rate is found by:",o:["taking the arithmetic average of the six most recent preceding months' year-on-year Composite CPI changes, rounded to two decimals","using only the latest month's CPI","averaging six CPI index levels","subtracting the fixed rate from the CPI"],a:0,e:"Average the six year-on-year Composite CPI percentage changes, rounded to 2 d.p."},
{t:"L1",q:"The rate actually used for an iBond is:",o:["the floating rate","the fixed minimum rate","the higher of the floating rate and the fixed minimum","the lower of the two"],a:2,e:"Use the higher of the floating rate and the minimum rate."},
{t:"L1",q:"The 2020 iBond issue had a minimum annual rate of:",o:["1%","2%","3%","0%"],a:1,e:"The 2020 issue had a 2% annual minimum."},
{t:"L1",q:"Earlier issues described in the supplement had a minimum of:",o:["2%","3%","1%","0.5%"],a:2,e:"Earlier issues had a 1% minimum."},
{t:"L1",q:"The quoted iBond rates are annual rates, although interest is paid:",o:["every six months","monthly","quarterly","annually"],a:0,e:"Rates are annual but paid semi-annually."},
{t:"L1",q:"The minimum rate is:",o:["added to the floating rate","a floor, not an amount added to the floating rate","the average of the two rates","applied only in the first year"],a:1,e:"The minimum is a floor only."},
{t:"L1",q:"Given six monthly year-on-year CPI changes averaging 3.20%, with a 2% minimum, the rate used is:",o:["5.20%","2.00%","3.20%","1.20%"],a:2,e:"Use the higher: 3.20%."},
{t:"L1",q:"Given six monthly year-on-year changes averaging 1.10%, with a 2% minimum, the rate used is:",o:["3.10%","1.10%","2.00%","0.55%"],a:2,e:"The floating rate is below the floor, so 2.00% applies."},
{t:"L1",q:"Case A rates of 2.8, 3.0, 3.1, 3.3, 3.4, 3.6 (%) average to:",o:["3.20%","3.10%","3.30%","19.2%"],a:0,e:"19.2 / 6 = 3.20%."},
{t:"L1",q:"Case B rates of 0.6, 0.8, 1.0, 1.2, 1.4, 1.6 (%) average to:",o:["6.6%","1.20%","1.10%","1.00%"],a:2,e:"6.6 / 6 = 1.10%."},
{t:"L1",q:"The iBond principal at maturity is:",o:["a nominal amount","indexed to the CPI","equal to the accumulated interest","the floating rate"],a:0,e:"Principal remains a nominal amount repaid at maturity."},
{t:"L1",q:"Which is a mistake when applying the iBond rule?",o:["Averaging the six inflation rates","Using the higher of the floating and fixed rates","Averaging six CPI index levels instead of the inflation rates","Rounding to two decimal places"],a:2,e:"You average the six inflation rates, not the index levels."},
{t:"L1",q:"An iBond differs from the fixed-deposit example because its interest rate:",o:["is fixed for the whole term","is linked to measured inflation subject to a minimum","is always zero","is set by the borrower"],a:1,e:"iBonds link interest to measured inflation, subject to a floor."},
{t:"L1",q:"The iBond floating rate uses which price measure?",o:["Composite CPI","GDP deflator","Producer price index","Nominal GDP"],a:0,e:"It is linked to Composite CPI inflation."},
{t:"L1",q:"If six monthly year-on-year CPI changes sum to 9.6%, the floating rate is:",o:["9.6%","0.96%","1.60%","16%"],a:2,e:"9.6 / 6 = 1.60%."},
{t:"L1",q:"If the floating rate is 0.5% and the minimum is 1%, the iBond pays:",o:["1.5%","1%","0.5%","0%"],a:1,e:"The floor of 1% applies."},
{t:"L1",q:"If the floating rate is 4% and the minimum is 2%, the iBond pays:",o:["6%","2%","4%","3%"],a:2,e:"Use the higher rate: 4%."},
{t:"L1",q:"An iBond's interest payments are linked to inflation, but its principal:",o:["is also fully indexed","remains a nominal amount repaid at maturity","grows with the CPI","is paid in shares"],a:1,e:"Only the interest is inflation-linked; principal stays nominal."},
{t:"L1",q:"The iBond's floating rate averages:",o:["CPI index levels","year-on-year percentage changes in the Composite CPI","nominal interest rates","GDP growth rates"],a:1,e:"It averages year-on-year percentage changes in the Composite CPI."},
{t:"L1",q:"Rounding of the iBond floating rate is to:",o:["two decimal places","one decimal place","the nearest whole percent","three decimal places"],a:0,e:"Rounded to two decimal places."},
{t:"L1",q:"If the six preceding monthly year-on-year CPI changes are 1.0, 1.2, 1.4, 1.6, 1.8, 2.0 (%), the floating rate is:",o:["9.0%","1.60%","1.50%","0.90%"],a:2,e:"9.0 / 6 = 1.50%."},
{t:"L1",q:"With a floating rate of 1.50% and a 2% minimum, the iBond pays:",o:["1.50%","3.50%","2.00%","0.50%"],a:2,e:"The floor of 2.00% applies."},
{t:"L1",q:"The iBond term and minimum denomination are:",o:["3 years and HK$10,000","1 year and HK$1,000","5 years and HK$10,000","3 years and HK$100,000"],a:0,e:"Three-year term, HK$10,000 minimum denomination."},
{t:"L1",q:"Which statement about iBonds is FALSE?",o:["They are issued by the HKSAR Government","They pay interest twice a year","Their principal is repaid at 100% at maturity","Their interest rate is fixed at issue"],a:3,e:"The rate floats with Composite CPI inflation, subject to a minimum."},
{t:"L1",q:"The 2020 issue compared the floating rate with a fixed minimum of:",o:["2% per year","1% per year","2% per month","0%"],a:0,e:"The 2020 issue had a 2% annual minimum."},
{t:"L1",q:"Averaging six CPI index levels rather than six inflation rates would be:",o:["correct","a mistake","required by the rule","the same thing"],a:1,e:"The rule requires averaging the six inflation rates."},

/* ---------------- LECTURE 2 : LABOR MARKET MEASURES ---------------- */
{t:"L2",q:"In Hong Kong, the labor force refers to the land-based non-institutional population aged:",o:["15 and over","18 and over","16 and over","all ages"],a:0,e:"The reference population is aged 15 and over."},
{t:"L2",q:"The labor force equals:",o:["employed only","unemployed only","the population aged 15 and over","employed + unemployed"],a:3,e:"Labor force = employed + unemployed."},
{t:"L2",q:"The labor force participation rate is:",o:["labor force divided by the land-based non-institutional population aged 15 and over","unemployed divided by the labor force","employed divided by the population","labor force divided by the total population"],a:0,e:"It is the labor force over the relevant population aged 15+."},
{t:"L2",q:"People outside the labor force are included in:",o:["both the numerator and the denominator","only the population denominator","only the numerator","neither"],a:1,e:"They appear only in the population denominator."},
{t:"L2",q:"With a labor force of 1,500 and a relevant population of 2,400, the participation rate is:",o:["60%","5%","62.5%","37.5%"],a:2,e:"1,500 / 2,400 = 0.625 = 62.5%."},
{t:"L2",q:"With 1,425 employed and 75 unemployed, the unemployment rate is:",o:["3%","5%","5.26%","4.8%"],a:1,e:"75 / 1,500 = 0.05 = 5%."},
{t:"L2",q:"The unemployment rate is:",o:["unemployed divided by the labor force","unemployed divided by the population","unemployed divided by the employed","underemployed divided by the labor force"],a:0,e:"Unemployment rate = unemployed / labor force."},
{t:"L2",q:"Discouraged workers are:",o:["not available for work","available for work but have not searched because they believe work is unavailable","working part-time","employed but seeking more hours"],a:1,e:"Discouraged workers are available but believe no work is available."},
{t:"L2",q:"Under Hong Kong definitions, discouraged workers are counted as:",o:["employed","unemployed","outside the labor force","underemployed"],a:1,e:"The Hong Kong definition includes discouraged workers in the unemployed."},
{t:"L2",q:"Jobless people who are available but have not searched because they have arranged to start a job later are:",o:["outside the labor force","counted as unemployed under HK definitions","employed","underemployed"],a:1,e:"This group is included in the HK unemployed definition."},
{t:"L2",q:"Jobless people who sought work but were temporarily unavailable because of sickness are:",o:["outside the labor force","unemployed under HK definitions","employed","discouraged workers"],a:1,e:"This is another HK unemployment exception."},
{t:"L2",q:"Employment status depends on:",o:["labels such as 'student' or 'retired'","the criteria, not labels alone","age only","income only"],a:1,e:"Status depends on the criteria, not on labels."},
{t:"L2",q:"Underemployment refers to employed persons who involuntarily worked less than ___ hours in the 7 days before enumeration.",o:["35","40","30","20"],a:0,e:"The threshold is 35 hours."},
{t:"L2",q:"The underemployment rate equals:",o:["underemployed divided by the labor force","underemployed divided by the population","underemployed divided by the employed","unemployed divided by the labor force"],a:0,e:"Underemployment rate = underemployed / labor force."},
{t:"L2",q:"An underemployed person is:",o:["outside the labor force","unemployed","employed and already included in the labor force","not counted anywhere"],a:2,e:"Underemployed people remain employed and are already in the labor force."},
{t:"L2",q:"With 45 underemployed and a labor force of 1,500, the underemployment rate is:",o:["5%","3%","1.875%","3.16%"],a:1,e:"45 / 1,500 = 0.03 = 3%."},
{t:"L2",q:"If 30 unemployed residents find jobs and the labor force is unchanged, the unemployment rate becomes:",o:["5%","2%","3%","4%"],a:2,e:"Unemployment falls to 45 → 45/1,500 = 3%."},
{t:"L2",q:"In that same scenario, the participation rate:",o:["falls","rises","is unchanged","doubles"],a:2,e:"The labor force is unchanged, so the participation rate stays at 62.5%."},
{t:"L2",q:"If the participation rate is 0.625 and the relevant population is 2,400, the labor force is:",o:["1,500","1,425","2,400","1,575"],a:0,e:"0.625 × 2,400 = 1,500."},
{t:"L2",q:"If the labor force is 1,500 and 1,425 are employed, the number unemployed is:",o:["45","1,425","105","75"],a:3,e:"1,500 − 1,425 = 75."},
{t:"L2",q:"If the labor force is 3,000 and the population aged 15+ is 5,000, the participation rate is:",o:["166.7%","40%","60%","6%"],a:2,e:"3,000 / 5,000 = 0.60 = 60%."},
{t:"L2",q:"If employment is 1,900 and unemployment is 100, the unemployment rate is:",o:["5.26%","4.76%","5%","10%"],a:2,e:"Labor force = 2,000, so 100/2,000 = 5%."},
{t:"L2",q:"The unemployment rate falls if:",o:["unemployed people leave the labor force","more people become unemployed","employed people lose their jobs","the labor force grows with no change in jobs"],a:0,e:"Unemployed people leaving the labor force shrink the numerator and denominator."},
{t:"L2",q:"An underemployed person must have involuntarily worked less than 35 hours in the past 7 days and:",o:["sought or been available for additional work","be under 25","be a full-time student","be outside the labor force"],a:0,e:"They must have sought additional work in the past 30 days or been available in the past 7 days."},
{t:"L2",q:"Which of these is included in the labor force?",o:["A full-time student with no job and not seeking work","A retiree not seeking work","A homemaker not seeking work","An employed part-time worker"],a:3,e:"Employed persons are part of the labor force."},
{t:"L2",q:"Underemployment is measured relative to:",o:["the labor force","the population","the employed","the unemployed"],a:0,e:"The denominator is the labor force."},
{t:"L2",q:"Underemployment counts people who are:",o:["unemployed","employed but working fewer hours than they want","outside the labor force","discouraged"],a:1,e:"Underemployed people are employed but involuntarily work fewer hours."},
{t:"L2",q:"Employment status in Hong Kong depends on criteria such as:",o:["whether a person is available for work and has searched, with listed exceptions","age alone","education alone","income alone"],a:0,e:"Availability and search behaviour (with exceptions) determine status."},
{t:"L2",q:"Which group is included in the labor force?",o:["Retirees not seeking work","Homemakers not seeking work","Children under 15","Employed persons"],a:3,e:"Employed persons are in the labor force."},
{t:"L2",q:"If the participation rate is 0.625, this equals:",o:["62.5%","6.25%","0.625%","625%"],a:0,e:"0.625 = 62.5%."},

/* ---------------- LECTURE 2 : TYPES OF UNEMPLOYMENT & BUSINESS CYCLE ---------------- */
{t:"L2",q:"Frictional unemployment is:",o:["long-term chronic unemployment","short-term unemployment while workers and jobs are matched","unemployment during recessions","unemployment caused by minimum wages"],a:1,e:"Frictional unemployment is short-term search unemployment."},
{t:"L2",q:"A worker relocating and searching for a local job is an example of:",o:["structural unemployment","cyclical unemployment","frictional unemployment","seasonal unemployment"],a:2,e:"Job search after relocating is frictional unemployment."},
{t:"L2",q:"Search unemployment may be beneficial because:",o:["it improves job matches in a dynamic economy","it raises the CPI","it reduces the labor force","it lowers potential output"],a:0,e:"Search takes time but can improve matches and is necessary in a dynamic economy."},
{t:"L2",q:"Structural unemployment is:",o:["short-term search unemployment","long-term chronic unemployment that remains even at normal output","unemployment during recessions","voluntary unemployment only"],a:1,e:"Structural unemployment is long-term and chronic, remaining at normal output."},
{t:"L2",q:"Printing skills no longer matching digital-publishing jobs is an example of:",o:["frictional unemployment","structural unemployment","cyclical unemployment","underemployment"],a:1,e:"Skill mismatch is structural unemployment."},
{t:"L2",q:"Which is a cause of structural unemployment?",o:["Skill mismatch, language barriers and discrimination","A short job search","A temporary recession","Seasonal demand"],a:0,e:"These are listed causes of structural unemployment."},
{t:"L2",q:"Cyclical unemployment is:",o:["search unemployment","skill mismatch","extra unemployment during a recession","chronic unemployment at normal output"],a:2,e:"Cyclical unemployment is the extra unemployment during a recession."},
{t:"L2",q:"Hotels laying off staff because a recession reduces bookings is:",o:["frictional","structural","cyclical","seasonal"],a:2,e:"Recession-driven layoffs are cyclical unemployment."},
{t:"L2",q:"Which unemployment type is consistent with normal output?",o:["Cyclical","Frictional and structural","Only cyclical","None"],a:1,e:"At normal output only frictional and structural unemployment remain."},
{t:"L2",q:"Language barriers as a cause of unemployment are an example of:",o:["frictional","structural","cyclical","seasonal"],a:1,e:"Language barriers are a structural cause."},
{t:"L2",q:"Discrimination in the labor market contributes to:",o:["frictional unemployment","structural unemployment","cyclical unemployment","underemployment only"],a:1,e:"Discrimination is a structural cause."},
{t:"L2",q:"Job search that takes time is:",o:["structural","cyclical","frictional","seasonal"],a:2,e:"Time taken to match workers and jobs is frictional unemployment."},
{t:"L2",q:"Long-term chronic unemployment at normal output is:",o:["frictional","structural","cyclical","voluntary"],a:1,e:"That describes structural unemployment."},
{t:"L2",q:"Which is NOT one of the three unemployment types in the lecture?",o:["Frictional","Structural","Cyclical","Seasonal"],a:3,e:"The lecture covers frictional, structural and cyclical unemployment."},
{t:"L2",q:"Potential output Y* is:",o:["the maximum output ever achieved","the output produced when capital and labor are used at normal rates","actual output","nominal GDP"],a:1,e:"Y* is output when resources are used at normal rates."},
{t:"L2",q:"The output gap is defined as:",o:["Y − Y*","Y* − Y","Y / Y*","u − u*"],a:1,e:"Output gap = Y* (potential) − Y (actual)."},
{t:"L2",q:"In a recessionary gap:",o:["Y* > Y and the gap is positive","Y > Y* and the gap is negative","Y = Y*","the gap is zero"],a:0,e:"Recessionary gap: Y* > Y, so Y* − Y is positive."},
{t:"L2",q:"In an expansionary gap:",o:["Y > Y* and Y* − Y is negative","Y* > Y","Y = Y*","unemployment exceeds the natural rate"],a:0,e:"Expansionary gap: Y > Y*, so Y* − Y is negative."},
{t:"L2",q:"In a recessionary gap:",o:["capital and labor are underused and output is below normal","output is above normal","excess demand pushes prices up","unemployment is below the natural rate"],a:0,e:"Resources are underused and output is below normal."},
{t:"L2",q:"In an expansionary gap, excess demand:",o:["puts downward pressure on prices","puts upward pressure on prices","leaves prices unchanged","causes deflation"],a:1,e:"Excess demand puts upward pressure on prices."},
{t:"L2",q:"The natural rate of unemployment u* reflects:",o:["cyclical unemployment","frictional and structural unemployment at normal output","only frictional unemployment","only structural unemployment"],a:1,e:"u* reflects frictional plus structural unemployment at normal output."},
{t:"L2",q:"Cyclical unemployment equals:",o:["u + u*","u − u*","u* − u","u × u*"],a:1,e:"Cyclical unemployment = u − u*."},
{t:"L2",q:"If actual unemployment is 6.2% and the natural rate is 4.5%, cyclical unemployment is:",o:["10.7 percentage points","2.7 percentage points","1.7 percentage points","0.17 percentage points"],a:2,e:"6.2% − 4.5% = 1.7 percentage points."},
{t:"L2",q:"At normal output:",o:["u > u*","u = u* and cyclical unemployment is zero","u < u*","cyclical unemployment is positive"],a:1,e:"At normal output the actual rate equals the natural rate."},
{t:"L2",q:"Full employment means:",o:["the unemployment rate is zero","there is no cyclical unemployment, though search and structural unemployment may remain","everyone works overtime","the participation rate is 100%"],a:1,e:"Full employment = zero cyclical unemployment; frictional and structural can remain."},
{t:"L2",q:"The short-run Phillips curve in the lecture shows:",o:["higher inflation associated with lower unemployment","higher inflation associated with higher unemployment","no relationship","inflation equal to unemployment"],a:0,e:"Higher inflation goes with lower unemployment along the short-run curve."},
{t:"L2",q:"The Phillips curve trade-off is:",o:["a permanent long-run rule","a short-run relationship, not an unconditional rule for every situation","the same as the Fisher equation","a measure of potential output"],a:1,e:"It is a short-run trade-off, not a permanent rule."},
{t:"L2",q:"If the economy is in a recessionary gap, unemployment is:",o:["below the natural rate","above the natural rate","equal to the natural rate","zero"],a:1,e:"Y* > Y implies u > u*."},
{t:"L2",q:"If Y* − Y is negative, the economy is in:",o:["a recessionary gap","an expansionary gap","normal output","full employment"],a:1,e:"Negative output gap means Y > Y*, an expansionary gap."},
{t:"L2",q:"If u < u*, the economy is most likely:",o:["in a recessionary gap","in an expansionary gap","at normal output","with zero frictional unemployment"],a:1,e:"u < u* implies negative cyclical unemployment, i.e. an expansionary gap."},
{t:"L2",q:"Which is consistent with a recessionary gap?",o:["u > u* and positive cyclical unemployment","u < u*","u = u*","a negative output gap"],a:0,e:"Recessionary gap: u > u* and cyclical unemployment is positive."},
{t:"L2",q:"The natural rate excludes:",o:["frictional unemployment","structural unemployment","cyclical unemployment","search unemployment"],a:2,e:"u* contains only frictional and structural unemployment."},
{t:"L2",q:"If the economy is at full employment, cyclical unemployment is:",o:["positive","negative","zero","undefined"],a:2,e:"Full employment means zero cyclical unemployment."},
{t:"L2",q:"The short-run Phillips curve suggests lower inflation is associated with:",o:["lower unemployment","higher unemployment","no change in unemployment","higher potential output"],a:1,e:"Lower inflation ↔ higher unemployment along the short-run curve."},
{t:"L2",q:"Potential output is also called:",o:["full-employment output","nominal GDP","the output gap","actual output"],a:0,e:"Y* is also called potential real GDP or full-employment output."},
{t:"L2",q:"In a recessionary gap, the output gap Y* − Y is:",o:["positive","negative","zero","undefined"],a:0,e:"Y* > Y gives a positive gap."},
{t:"L2",q:"In an expansionary gap, the output gap Y* − Y is:",o:["positive","negative","zero","undefined"],a:1,e:"Y > Y* gives a negative gap."},
{t:"L2",q:"During a recession, cyclical unemployment is:",o:["negative","positive","zero","undefined"],a:1,e:"u > u* in a recession, so cyclical unemployment is positive."},
{t:"L2",q:"An available office worker who stops applying because they believe there are no vacancies is:",o:["employed","a discouraged worker counted as unemployed under HK definitions","outside the labor force","underemployed"],a:1,e:"This is the textbook discouraged-worker example."},

/* ---------------- LECTURE 3 : GDP ---------------- */
{t:"L3",q:"GDP is defined as:",o:["the market value of the final goods and services produced in a country during a given period","the total income of a country's residents","the value of all sales in the economy","the value of intermediate goods produced"],a:0,e:"GDP = market value of final goods and services produced domestically in a period."},
{t:"L3",q:"Which is one of the four parts of the GDP definition?",o:["Gross national income","Net exports only","Market value","Household wealth"],a:2,e:"The four parts are market value, final goods and services, domestic production and current period."},

/* ============================================================
   RENDERING & LOGIC
   ============================================================ */
const quiz = document.getElementById('quiz');
const sAns = document.getElementById('sAns');
const sCor = document.getElementById('sCor');
const sAcc = document.getElementById('sAcc');
const sTot = document.getElementById('sTot');
const progress = document.getElementById('progress');
const LETTERS = ['A','B','C','D'];

let answered = 0, correct = 0;

sTot.textContent = QUESTIONS.length;

function buildCard(q, i){
  const card = document.createElement('div');
  card.className = 'qcard';
  card.dataset.topic = q.t;

  const head = document.createElement('div');
  head.className = 'qhead';
  head.innerHTML = '<span class="qnum">Q' + (i+1) + '</span><span class="qtag">' + q.t + '</span>';
  const txt = document.createElement('div');
  txt.className = 'qtext';
  txt.textContent = q.q;
  head.appendChild(txt);
  card.appendChild(head);

  const opts = document.createElement('div');
  opts.className = 'opts';

  q.o.forEach((text, j) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.type = 'button';
    b.innerHTML = '<span class="letter">' + LETTERS[j] + '</span><span>' + text + '</span>';
    b.addEventListener('click', () => choose(card, q, j, b, opts));
    opts.appendChild(b);
  });

  card.appendChild(opts);

  const ex = document.createElement('div');
  ex.className = 'explain';
  ex.innerHTML = '<b>Answer: ' + LETTERS[q.a] + '.</b> ' + q.e;
  card.appendChild(ex);

  return card;
}

function choose(card, q, picked, btn, opts){
  if (card.dataset.done === '1') return;
  card.dataset.done = '1';

  const buttons = opts.querySelectorAll('.opt');
  buttons.forEach((b, j) => {
    b.classList.add('done');
    b.disabled = true;
    if (j === q.a) b.classList.add('correct');
  });

  if (picked !== q.a) btn.classList.add('wrong');

  card.querySelector('.explain').classList.add('show');

  answered++;
  if (picked === q.a) correct++;
  updateStats();
}

function updateStats(){
  sAns.textContent = answered;
  sCor.textContent = correct;
  sAcc.textContent = answered === 0 ? '—' : Math.round((correct/answered)*1000)/10 + '%';
  progress.style.width = (answered / QUESTIONS.length * 100) + '%';
}

QUESTIONS.forEach((q, i) => quiz.appendChild(buildCard(q, i)));

/* Filters */
document.querySelectorAll('.filters button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const f = btn.dataset.f;
    document.querySelectorAll('.qcard').forEach(c => {
      c.classList.toggle('hidden', f !== 'all' && c.dataset.topic !== f);
    });
    window.scrollTo({top:0, behavior:'smooth'});
  });
});

/* Reset */
document.getElementById('resetBtn').addEventListener('click', () => {
  if (!confirm('Reset all answers and your score?')) return;
  answered = 0; correct = 0;
  document.querySelectorAll('.qcard').forEach(c => {
    c.dataset.done = '0';
    c.querySelectorAll('.opt').forEach(b => {
      b.classList.remove('correct','wrong','done');
      b.disabled = false;
    });
    c.querySelector('.explain').classList.remove('show');
  });
  updateStats();
  window.scrollTo({top:0, behavior:'smooth'});
});

updateStats();
</script>
</body>
</html>
