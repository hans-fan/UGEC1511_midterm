<style>
  :root{
    --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --accent:#c2410c;
    --good:#15803d; --goodbg:#dcfce7; --bad:#b91c1c; --badbg:#fee2e2;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:#f1f5f9; color:var(--ink); line-height:1.55;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang HK","Microsoft JhengHei",sans-serif;
  }
  header{background:linear-gradient(135deg,#431407,#7c2d12 55%,#c2410c); color:#fff; padding:26px 18px 22px; text-align:center}
  header h1{margin:0 0 6px; font-size:1.4rem}
  header p{margin:0; opacity:.9; font-size:.88rem}
  .bar{
    position:sticky; top:0; z-index:30; background:#fff; border-bottom:1px solid var(--line);
    padding:9px 12px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center;
    box-shadow:0 2px 10px rgba(15,23,42,.07);
  }
  .stat{font-size:.78rem; background:#ffedd5; color:#7c2d12; padding:5px 10px; border-radius:999px; font-weight:700}
  .stat b{color:var(--accent)}
  .filters{display:flex; gap:5px; flex-wrap:wrap}
  .filters button, .reset{
    border:1px solid var(--line); background:#fff; color:#334155; padding:6px 11px;
    border-radius:999px; font-size:.78rem; cursor:pointer; font-weight:700; transition:.15s;
  }
  .filters button:hover{background:#f8fafc}
  .filters button.active{background:var(--accent); color:#fff; border-color:var(--accent)}
  .reset{background:#fee2e2; color:#b91c1c; border-color:#fecaca}
  .progresswrap{height:6px; background:#e2e8f0}
  .progress{height:6px; background:var(--accent); width:0%; transition:width .25s}
  main{max-width:880px; margin:0 auto; padding:20px 13px 80px}
  .qcard{background:#fff; border:1px solid var(--line); border-radius:14px; padding:15px 17px; margin-bottom:12px; box-shadow:0 1px 3px rgba(15,23,42,.05)}
  .qhead{display:flex; gap:8px; align-items:flex-start; margin-bottom:11px}
  .qnum{flex:0 0 auto; background:var(--accent); color:#fff; font-size:.72rem; font-weight:800; padding:3px 8px; border-radius:7px; margin-top:2px}
  .qtag{flex:0 0 auto; font-size:.64rem; font-weight:800; padding:3px 7px; border-radius:7px; margin-top:3px; letter-spacing:.5px}
  .qtag.L1{background:#ffedd5; color:#9a3412}
  .qtag.L2{background:#e0f2fe; color:#075985}
  .qtag.L3{background:#dcfce7; color:#166534}
  .qtext{font-size:.97rem; font-weight:600}
  .opts{display:grid; gap:7px}
  .opt{
    display:flex; gap:9px; align-items:flex-start; text-align:left; width:100%;
    background:#fff; border:1.5px solid var(--line); border-radius:10px;
    padding:9px 11px; cursor:pointer; font-size:.91rem; color:#1e293b; transition:.12s;
  }
  .opt:hover:not(.done){border-color:#fb923c; background:#fff7ed}
  .opt .letter{flex:0 0 auto; font-weight:800; color:#475569; font-size:.8rem; width:17px; text-align:center; margin-top:1px}
  .opt.correct{background:var(--goodbg); border-color:var(--good)}
  .opt.correct .letter{color:var(--good)}
  .opt.wrong{background:var(--badbg); border-color:var(--bad)}
  .opt.wrong .letter{color:var(--bad)}
  .opt.done{cursor:default}
  .explain{margin-top:10px; padding:10px 12px; background:#f8fafc; border-left:4px solid var(--accent); border-radius:0 8px 8px 0; font-size:.85rem; color:#334155; display:none}
  .explain.show{display:block}
  .explain b{color:var(--accent)}
  .hidden{display:none!important}
  footer{text-align:center; font-size:.8rem; color:var(--muted); padding:0 14px 40px}

<script>
const QUESTIONS = [

/* ==================== LECTURE 1 — CPI & INFLATION SCENARIOS ==================== */
{t:"L1",q:"Your favourite cha chaan teng raises its set lunch from $45 to $50. The shop next door still charges $45. What happened?",o:["Inflation occurred","Only a relative price change for that restaurant occurred","Deflation occurred","The CPI must have risen 11%"],a:1,e:"Inflation is a rise in the overall price level. One shop's price change is a relative price change."},
{t:"L1",q:"Over one year, every price in the economy roughly doubles. Which is true?",o:["Relative prices also doubled","The price level doubled but relative prices are unchanged","Only the CPI changed, not relative prices","Real GDP doubled"],a:1,e:"If all prices move proportionally, every price ratio stays the same."},
{t:"L1",q:"The CPI was 1.05 last year and 1.092 this year. The inflation rate this year is:",o:["4.2%","9.2%","4.0%","0.42%"],a:2,e:"(1.092 − 1.05)/1.05 = 4%. The 4.2% trap comes from dividing by 1.00 instead of last year's CPI."},
{t:"L1",q:"A student says: 'The CPI went from 1.20 to 1.26, so inflation was 6%.' Which is the best response?",o:["Correct, 6%","Inflation was 5%, because you divide the 0.06 change by last year's index","Inflation was 0.06%","Inflation cannot be computed"],a:1,e:"0.06/1.20 = 5%. A six-point rise in an index is not a 6% inflation rate."},
{t:"L1",q:"CPI: 1.00 in 2024, 1.10 in 2025, 1.21 in 2026. Inflation in 2026 is:",o:["21%","11%","10%","9.09%"],a:2,e:"(1.21 − 1.10)/1.10 = 10%. The 21% figure is the two-year cumulative change."},
{t:"L1",q:"The CPI falls from 1.04 to 1.00. What happened?",o:["Inflation was −3.85%, i.e. deflation","Inflation was −4%","Prices were unchanged","Deflation was 4.04%"],a:0,e:"−0.04/1.04 = −3.85%. Dividing by the new index instead of the old one gives the −4% trap."},
{t:"L1",q:"Your newspaper reports inflation fell from 3% to 1.5%. A friend says 'prices are falling now.' Is your friend right?",o:["Yes, prices fell","No — the price level is still rising, just more slowly","Yes, if inflation is below 2%","Only if the CPI fell"],a:1,e:"A lower positive inflation rate still means rising prices. Only negative inflation is falling prices."},
{t:"L1",q:"Over a year, MTR fares, rent, food and cinema tickets all fall. This is best described as:",o:["A relative price change","Deflation","Disinflation","A substitution bias"],a:1,e:"Broad-based falling prices with negative inflation is deflation."},
{t:"L1",q:"Only the price of milk tea falls while everything else is unchanged. This is:",o:["Deflation","A relative price fall for milk tea","Negative inflation in the CPI","Disinflation"],a:1,e:"Deflation requires most prices to fall. One good's price fall is a relative price change."},
{t:"L1",q:"Your monthly basket in 2024: 20 lunches at $40 and 10 coffees at $20, total $1,000. In 2025 lunches cost $44 and coffees $22. The 2025 CPI (2024 = 1.00) is:",o:["1.00","1.08","1.10","1.20"],a:2,e:"20×44 + 10×22 = 880 + 220 = $1,100, so CPI = 1,100/1,000 = 1.10."},
{t:"L1",q:"Using that basket, the inflation rate in 2025 is:",o:["10%","8%","12%","1.10%"],a:0,e:"(1.10 − 1.00)/1.00 = 10%."},
{t:"L1",q:"If the 2026 CPI for the same basket is also 1.10, inflation in 2026 is:",o:["10%","0%","−10%","1%"],a:1,e:"(1.10 − 1.10)/1.10 = 0%. The 10% figure wrongly repeats the level."},
{t:"L1",q:"You switch from beef to chicken because beef became expensive. Your true cost of living rose less than the CPI suggests. This is an example of:",o:["Quality adjustment bias","Substitution bias","Deflation","Indexing"],a:1,e:"The fixed basket keeps buying beef, so it overstates your cost increase — substitution bias."},
{t:"L1",q:"A new phone costs more than last year's model but has a much faster processor. If the CPI ignores the quality gain, it:",o:["Understates inflation","Overstates the pure price increase","Is exactly right","Becomes the GDP deflator"],a:1,e:"Part of the price rise is better quality, so ignoring it overstates pure inflation."},
{t:"L1",q:"A supermarket runs a one-week promotion cutting many prices. Is this deflation?",o:["Yes","No — it is temporary and not a sustained broad fall","Yes, because the CPI will fall","Only if it lasts a month"],a:1,e:"Deflation is sustained, broad-based price decline, not a short promotion."},
{t:"L1",q:"CPI was 103 last year and 105 this year. Inflation is:",o:["2%","1.94%","1.90%","5%"],a:1,e:"2/103 = 1.94%. Using the two index points directly as a percentage is the trap."},
{t:"L1",q:"CPI was 105 last year and 103 this year. This year had:",o:["2% inflation","1.94% inflation","About 1.9% deflation","Zero inflation"],a:2,e:"−2/105 = −1.90%, so prices fell."},
{t:"L1",q:"A student says 'the CPI rose by 2 index points, so inflation is 2%.' If last year's CPI was 1.10, actual inflation is:",o:["2%","1.82%","0.02%","18.2%"],a:1,e:"0.02/1.10 = 1.82%. Index points are not percentage points."},
{t:"L1",q:"The CPI rose 14% over two years. Which statement is safe?",o:["Annual inflation was 7% each year","The cumulative change was 14%, but the annual path cannot be known from this alone","Annual inflation was 14%","Deflation occurred"],a:1,e:"Cumulative change is not the annual rate, and splitting it evenly is a guess."},
{t:"L1",q:"The CPI rises from 1.08 to 1.14. Which is correct?",o:["The price level rose 14% this year","The annual inflation rate was 5.56%","The annual inflation rate was 6%","Prices fell"],a:1,e:"0.06/1.08 = 5.56%. The 14% is the level relative to the base year."},
{t:"L1",q:"A CPI of 1.14 in 2026 means:",o:["Prices rose 14% during 2026","The basket costs 14% more than in the base year","Inflation is 114%","Real income rose 14%"],a:1,e:"An index level compares with the base year; it is not an annual rate."},
{t:"L1",q:"If the CPI in the base year is 1.00 and this year is 2.00, the cumulative price change is:",o:["100%","50%","200%","2%"],a:0,e:"2.00/1.00 − 1 = 100%. Doubling means a 100% increase, not 200%."},
{t:"L1",q:"Your rent rose 4% this year while the CPI rose 3%. Your real rent:",o:["Rose about 0.97%","Fell about 1%","Rose 7%","Was unchanged"],a:0,e:"1.04/1.03 = 1.0097, a real rise of about 0.97%."},
{t:"L1",q:"Petrol prices doubled but you do not own a car. The CPI records a rise, but your own cost of living barely moves. Why?",o:["The CPI is wrong","The CPI is an average basket and your personal basket differs","Deflation occurred","Petrol is an intermediate good"],a:1,e:"The CPI reflects an average household, not any individual's spending pattern."},
{t:"L1",q:"Two students have different spending patterns. Which statement is correct?",o:["They face exactly the same inflation rate","Their personal inflation rates can differ from the CPI","The CPI cannot be computed","Only one of them is in the labour force"],a:1,e:"The CPI is a weighted average; individual experiences vary with the basket."},
{t:"L1",q:"A good with a tiny weight in the CPI doubles in price. The effect on the CPI is:",o:["Large","Small","Zero by definition","The same as if it had a large weight"],a:1,e:"The weight determines the impact on the overall index."},
{t:"L1",q:"All prices and all wages in the economy double. Which is true?",o:["Relative prices double","The price level doubles and relative prices are unchanged","Real wages double","The CPI is unchanged"],a:1,e:"Proportional changes leave every ratio unchanged."},
{t:"L1",q:"Bus fares rise while every other price is unchanged. What is the correct description?",o:["The price level doubled","Bus travel became relatively more expensive","Deflation occurred","The GDP deflator fell"],a:1,e:"A single price change alters relative prices, not the overall level dramatically."},
{t:"L1",q:"The government wants to address the rising cost of housing specifically. This is a policy about:",o:["The general price level","A particular price, not general inflation","The natural rate of unemployment","Real GDP"],a:1,e:"Housing-specific policy targets a relative price; general inflation policy uses monetary and fiscal tools."},

/* ==================== LECTURE 1 — DEFLATING & INDEXING SCENARIOS ==================== */
{t:"L1",q:"Your salary rises from $15,000 to $15,750 (5%) and the CPI also rises 5%. Your real salary:",o:["Rises 10%","Rises 5%","Is unchanged","Falls 5%"],a:2,e:"1.05/1.05 = 1.00. Equal nominal and price growth leaves purchasing power flat."},
{t:"L1",q:"Your salary rises 3% while the CPI rises 5%. Your purchasing power:",o:["Rises 2%","Falls about 1.9%","Rises 8%","Is unchanged"],a:1,e:"1.03/1.05 = 0.981, about a 1.9% fall. Subtracting (3 − 5 = −2) is close but not exact."},
{t:"L1",q:"Your salary rises 6% while the CPI rises 2%. Your real salary rises about:",o:["4%","8%","3.92%","3%"],a:2,e:"1.06/1.02 = 1.0392, about 3.92%."},
{t:"L1",q:"You earn a nominal $20,000 and the CPI is 1.25. Your real income is:",o:["$25,000","$16,000","$1,600","$20,000"],a:1,e:"20,000/1.25 = $16,000. Multiplying would be indexing, not deflating."},
{t:"L1",q:"Your nominal income is $5,000 and the CPI is 1.14. Real income is about:",o:["$5,700","$4,385.96","$1,140","$5,000"],a:1,e:"5,000/1.14 = $4,385.96."},
{t:"L1",q:"A $5,000 scholarship is indexed to the CPI, which rises from 1.00 to 1.14. The new payment is:",o:["$5,140","$5,700","$5,714","$5,000"],a:1,e:"5,000 × 1.14 = $5,700. Adding 14% of $1,000 is the trap."},
{t:"L1",q:"The same scholarship also promises a 2% real increase. The new payment is:",o:["$5,700","$5,800","$5,814","$6,000"],a:2,e:"5,000 × 1.14 × 1.02 = $5,814. The factors multiply; adding 14% and 2% is wrong."},
{t:"L1",q:"Your pension of $8,000 is indexed to the CPI, which rises from 1.00 to 1.20. You will receive:",o:["$8,800","$9,600","$8,200","$6,667"],a:1,e:"8,000 × 1.20 = $9,600."},
{t:"L1",q:"Your rent of $10,000 is indexed to the CPI, now 1.25. The indexed rent is:",o:["$12,500","$11,250","$8,000","$10,250"],a:0,e:"10,000 × 1.25 = $12,500."},
{t:"L1",q:"Deflation occurs and your payment is fully indexed to the CPI. Your payment:",o:["Rises","Falls in proportion to the CPI decline","Is unchanged","Doubles"],a:1,e:"Indexing tracks the index in both directions, including downward."},
{t:"L1",q:"Your pension is fixed at $8,000 while the CPI rises 20%. Your real pension is about:",o:["$9,600","$6,666.67","$8,000","$1,600"],a:1,e:"8,000/1.20 = $6,666.67. A nominal freeze means a real cut."},
{t:"L1",q:"Which arrangement preserves the purchasing power of a fixed payment over time?",o:["A fixed nominal amount","Indexing the payment to the CPI","Paying it earlier","Deflating it"],a:1,e:"Indexing raises the nominal amount in line with prices."},
{t:"L1",q:"You want to compare your 2019 salary with your 2026 salary. What should you do?",o:["Compare the nominal amounts directly","Deflate each by the CPI to put both in the same year's prices","Multiply both by the CPI","Add the inflation rates together"],a:1,e:"Nominal amounts from different years are not comparable without deflating."},
{t:"L1",q:"Nominal income is unchanged and the CPI doubles. Real income:",o:["Doubles","Halves","Is unchanged","Rises 50%"],a:1,e:"Dividing by a doubled CPI halves real income."},
{t:"L1",q:"Worker A gets a 10% raise when the CPI rises 10%. Worker B gets 5% when the CPI rises 2%. Who gains more purchasing power?",o:["Worker A","Worker B","Both equally","Neither gains"],a:1,e:"A: 1.10/1.10 = 0%. B: 1.05/1.02 = +2.94%. B gains more."},
{t:"L1",q:"The minimum wage rises from $40 to $42 (5%) while the CPI rises 5%. The real minimum wage:",o:["Rises 5%","Is unchanged","Falls 5%","Rises 10%"],a:1,e:"1.05/1.05 = 1.00. Equal growth leaves the real wage flat."},
{t:"L1",q:"In the base year, $1,000 bought a certain basket. The CPI is now 1.10. To buy the same basket you now need:",o:["$1,000","$1,100","$909","$1,010"],a:1,e:"1,000 × 1.10 = $1,100."},
{t:"L1",q:"Your nominal income doubles but prices triple. Your real income:",o:["Rises","Falls","Is unchanged","Triples"],a:1,e:"2/3 = 0.67, so real income falls by about a third."},
{t:"L1",q:"Which operation converts a real quantity back into a nominal one?",o:["Divide by the CPI","Multiply by the CPI","Subtract the inflation rate","Subtract the real interest rate"],a:1,e:"Indexing multiplies by the price index; deflating divides by it."},
{t:"L1",q:"Your wage is $100 in the base year and $110 now, with the CPI at 1.25. Your real wage:",o:["Rose","Fell from $100 to $88","Is unchanged","Doubled"],a:1,e:"110/1.25 = $88, below the original $100."},

/* ==================== LECTURE 1 — DEFLATOR, BIASES, RELATIVE PRICES ==================== */
{t:"L1",q:"You buy an imported phone. Its price appears in which index?",o:["The GDP deflator only","The CPI only","Both equally","Neither"],a:1,e:"Imports can sit in the consumer basket but are not domestic production."},
{t:"L1",q:"A Hong Kong factory exports machinery. Its price appears in:",o:["The CPI only","The GDP deflator, because it is domestic production","Neither index","Both equally"],a:1,e:"Exports are domestically produced, so they enter the deflator, not the consumer basket."},
{t:"L1",q:"Nominal GDP is $20,000 and real GDP is $16,000. The GDP deflator is:",o:["80","125","1.25%","36,000"],a:1,e:"(20,000/16,000) × 100% = 125%. Inverting the ratio gives the 80 trap."},
{t:"L1",q:"The GDP deflator is 120 and nominal GDP is $24,000. Real GDP is:",o:["$20,000","$28,800","$2,000","$22,800"],a:0,e:"Real = nominal / (deflator/100) = 24,000/1.20 = $20,000."},
{t:"L1",q:"The GDP deflator is 110 and real GDP is $10,000. Nominal GDP is:",o:["$9,090","$11,000","$10,110","$1,100"],a:1,e:"Nominal = real × deflator/100 = 10,000 × 1.10 = $11,000."},
{t:"L1",q:"Nominal GDP and real GDP both rise 8%. The GDP deflator:",o:["Rises 8%","Is unchanged","Falls 8%","Rises 16%"],a:1,e:"The deflator is the ratio; equal growth leaves it unchanged."},
{t:"L1",q:"A student says 'the GDP deflator is 116, so inflation is 116%.' The error is that:",o:["The deflator cannot exceed 100","The deflator is an index level; inflation is its percentage change","Inflation is always 16%","The deflator measures unemployment"],a:1,e:"You must compute the percentage change in the deflator to get inflation."},
{t:"L1",q:"The GDP deflator rose from 120 last year to 125 this year. Inflation was about:",o:["5%","4.17%","25%","1.2%"],a:1,e:"5/120 = 4.17%. Five index points is not a 5% inflation rate."},
{t:"L1",q:"Which index best captures the price of machinery bought by a local factory?",o:["The CPI","The GDP deflator","Neither","The labour force survey"],a:1,e:"The deflator covers all domestically produced goods, including investment goods."},
{t:"L1",q:"Which index best captures the price of imported groceries bought by households?",o:["The GDP deflator","The CPI","Both equally","Neither"],a:1,e:"Imported consumer goods can be in the CPI basket."},
{t:"L1",q:"All prices in the economy double. The GDP deflator:",o:["Stays at 100","Roughly doubles relative to the base year","Falls","Is zero"],a:1,e:"Nominal GDP doubles while real GDP is unchanged, so the deflator doubles."},
{t:"L1",q:"Prices of domestic output rose 5% and the deflator went from 100 to 105. Which statement is correct?",o:["Inflation was 105%","Prices of domestic output rose 5%","Real GDP rose 5%","The CPI also rose exactly 5%"],a:1,e:"The deflator measures domestic output prices; the CPI may differ because of coverage."},
{t:"L1",q:"Which is a relative price statement rather than a price-level statement?",o:["The CPI rose 3%","Rent rose faster than transport fares","The price level doubled","Inflation is 2%"],a:1,e:"Comparing one price with others is a relative price statement."},
{t:"L1",q:"If only your landlord raises rent, the CPI:",o:["Must double","Rises only according to housing's weight in the basket","Falls","Is unaffected by weight"],a:1,e:"The weight of housing determines the impact on the index."},
{t:"L1",q:"The CPI overstates true inflation partly because it ignores consumers switching to cheaper alternatives. This is called:",o:["Quality adjustment bias","Substitution bias","Deflation","Shoe-leather cost"],a:1,e:"Consumers substituting away from expensive goods reduces their true cost increase."},
{t:"L1",q:"A laptop's price rises 10% but it is twice as fast as the old model. The CPI treating it as pure inflation will:",o:["Understate inflation","Overstate the pure price increase","Be exactly right","Equal the deflator"],a:1,e:"Ignoring quality improvement overstates the pure price change."},
{t:"L1",q:"Which situation would make the CPI a poor guide to YOUR cost of living?",o:["You buy exactly the standard basket","You never buy the goods whose prices rose sharply","All prices move together","You live in the base year"],a:1,e:"If your basket differs a lot from the standard one, the CPI misrepresents you."},
{t:"L1",q:"Which is true of the CPI and the GDP deflator?",o:["They always give identical numbers","They can differ because they cover different goods","The CPI covers all domestic production","The deflator covers imports"],a:1,e:"Different coverage means the two indexes can diverge."},
{t:"L1",q:"Both the CPI and the GDP deflator are:",o:["Inflation rates","Price index levels","Measures of output","Labour market statistics"],a:1,e:"Both are index levels; their percentage changes are inflation."},
{t:"L1",q:"A rise in the price of one good with a large CPI weight, compared with a rise in a good with a small weight, will:",o:["Have the same effect on the CPI","Have a larger effect on the CPI","Have no effect","Cause deflation"],a:1,e:"Larger weights produce larger index movements."},

/* ==================== LECTURE 1 — COSTS OF INFLATION & INTEREST ==================== */
{t:"L1",q:"A bank pays 5% nominal interest while inflation is 2%. The approximate real return is:",o:["7%","3%","2.5%","−3%"],a:1,e:"r ≈ 5 − 2 = 3%. The Fisher equation subtracts inflation."},
{t:"L1",q:"A bank pays 2% nominal interest while inflation is 5%. The approximate real return is:",o:["7%","3%","−3%","−7%"],a:2,e:"r ≈ 2 − 5 = −3%. You lose purchasing power."},
{t:"L1",q:"Your fixed deposit earns 4% and inflation turns out to be 1% rather than the 3% you expected. You:",o:["Lose relative to expectations","Gain relative to expectations","Are unaffected","Earn 4% real"],a:1,e:"Lower-than-expected inflation gives a higher real return to the lender."},
{t:"L1",q:"You borrow at a fixed 4% nominal rate and inflation unexpectedly reaches 6%. Who gains?",o:["You, the borrower","The lender","Neither","The government only"],a:0,e:"Unexpectedly high inflation erodes the real value of the repayment, helping borrowers."},
{t:"L1",q:"Inflation is expected at 3% and the bank sets a 5% nominal rate. Inflation turns out to be exactly 3%. Who is redistributed to?",o:["Borrowers gain","Lenders lose","Nobody — expected inflation was priced in","The government gains"],a:2,e:"If inflation is fully expected, the nominal rate adjusts and no surprise redistribution occurs."},
{t:"L1",q:"During high inflation you visit the ATM more often and hold less cash. This reflects:",o:["Shoe-leather costs","Menu costs","Substitution bias","Quality adjustment bias"],a:0,e:"Resources spent economising on cash holdings are shoe-leather costs."},
{t:"L1",q:"Your salary rises with inflation, pushing you into a higher tax bracket so your real tax burden rises. This is:",o:["Shoe-leather cost","Bracket creep, a tax distortion","Substitution bias","Deflation"],a:1,e:"Bracket creep is a tax distortion caused by inflation."},
{t:"L1",q:"High inflation makes it hard for you to tell whether a price rise is specific to that good or just general inflation. This is:",o:["Shoe-leather cost","Noise in the price system","Bracket creep","Quality bias"],a:1,e:"Inflation obscures relative price signals."},
{t:"L1",q:"You are planning retirement 30 years ahead and inflation becomes highly unpredictable. The main cost is:",o:["Shoe-leather costs","Interference with long-run planning","Substitution bias","Deflation"],a:1,e:"Uncertainty makes retirement and investment planning harder."},
{t:"L1",q:"You keep $10,000 in cash under the mattress while inflation is 3%. Your real return is approximately:",o:["+3%","0%","−3%","+10%"],a:2,e:"Cash earns no nominal interest, so its purchasing power falls with inflation."},
{t:"L1",q:"Which situation gives a negative real interest rate?",o:["Nominal 5%, inflation 2%","Nominal 3%, inflation 3%","Nominal 1%, inflation 4%","Nominal 8%, inflation 2%"],a:2,e:"1 − 4 = −3%, so the real rate is negative."},
{t:"L1",q:"A saver with a fixed nominal deposit is hurt most by:",o:["Unexpectedly low inflation","Unexpectedly high inflation","Expected inflation at exactly the contract rate","Deflation"],a:1,e:"Unexpectedly high inflation reduces the real value of the fixed repayment."},
{t:"L1",q:"Your nominal wage is fixed for three years. Which outcome do you prefer?",o:["Higher-than-expected inflation","Lower-than-expected inflation","Exactly expected inflation","Deflation only"],a:1,e:"Your fixed nominal wage buys more if inflation is lower than expected."},
{t:"L1",q:"If the nominal interest rate is 0% and inflation is 2%, a saver:",o:["Gains 2% in real terms","Loses about 2% in purchasing power","Breaks even","Earns a 0% real return"],a:1,e:"Real return ≈ 0 − 2 = −2%."},
{t:"L1",q:"Which of these is NOT a cost of inflation listed in the lecture?",o:["Shoe-leather costs","Noise in the price system","Tax distortions","Substitution bias"],a:3,e:"Substitution bias is a CPI measurement problem, not a cost inflation imposes."},
{t:"L1",q:"A shop reprints all its menus every week because prices keep changing. This is a cost of:",o:["Deflation","Inflation making prices change frequently","Substitution bias","Quality bias"],a:1,e:"Frequent price changes create real costs for firms."},
{t:"L1",q:"Two savers have identical fixed nominal deposits. Inflation surprises upward. Who is worse off?",o:["Neither — both are identical","Both are equally worse off relative to expectations","The one with the shorter maturity gains more","Only borrowers are affected"],a:1,e:"Both lenders lose the same real value."},
{t:"L1",q:"Which statement about the Fisher equation is correct?",o:["It gives an exact identity in all cases","It is an approximation: real ≈ nominal − inflation","It says real = nominal + inflation","It relates GDP and unemployment"],a:1,e:"The lecture uses the subtraction relationship as an approximation."},
{t:"L1",q:"You lend $1,000 at 5% for one year and inflation is 5%. Your real return is approximately:",o:["5%","10%","0%","−5%"],a:2,e:"r ≈ 5 − 5 = 0%. The nominal gain is exactly eaten by inflation."},
{t:"L1",q:"Which group benefits most from unexpectedly high inflation?",o:["Lenders with fixed nominal contracts","Workers with fixed nominal wages","Borrowers with fixed nominal debts","Savers holding cash"],a:2,e:"Borrowers repay with money that is worth less than expected."},

/* ==================== LECTURE 1 — iBONDS SCENARIOS ==================== */
{t:"L1",q:"The six preceding monthly year-on-year Composite CPI changes are 1.0, 1.2, 1.4, 1.6, 1.8 and 2.0 (%). The floating rate is:",o:["9.0%","1.60%","1.50%","0.90%"],a:2,e:"9.0/6 = 1.50%. The 9.0% trap forgets to divide by six."},
{t:"L1",q:"With that 1.50% floating rate and the 2020 issue's 2% minimum, the iBond pays:",o:["1.50%","3.50%","2.00%","0.50%"],a:2,e:"The minimum is a floor, not an add-on. Use the higher rate: 2.00%."},
{t:"L1",q:"The six monthly changes are 2.0, 2.2, 2.4, 2.6, 2.8 and 3.0 (%). The floating rate is:",o:["2.50%","15.0%","2.60%","2.40%"],a:0,e:"15.0/6 = 2.50%."},
{t:"L1",q:"With a floating rate of 2.50% and a 2% minimum, the iBond pays:",o:["4.50%","2.50%","2.00%","0.50%"],a:1,e:"The floating rate is above the floor, so it applies."},
{t:"L1",q:"The six monthly changes sum to 9.6%. The floating rate is:",o:["9.6%","1.60%","0.96%","16%"],a:1,e:"9.6/6 = 1.60%."},
{t:"L1",q:"The six monthly changes sum to 6.6% and the 2020 issue's minimum is 2%. The rate used is:",o:["3.10%","1.10%","2.00%","0.55%"],a:2,e:"The floating rate is 1.10%, below the floor, so 2.00% applies."},
{t:"L1",q:"Monthly year-on-year changes are −0.2, −0.1, 0, 0.1, 0.2 and 0.3 (%), with a 1% minimum. The rate used is:",o:["0.05%","1.00%","0.5%","0%"],a:1,e:"The average is 0.05%, below the floor, so 1.00% applies."},
{t:"L1",q:"A student computes the iBond rate by averaging the six CPI index levels. This is:",o:["Correct","Wrong — you average the six year-on-year inflation rates","Correct only if inflation is positive","Required by the rule"],a:1,e:"The rule averages the six year-on-year percentage changes, not index levels."},
{t:"L1",q:"A student adds the 2% minimum to a 3.2% floating rate and gets 5.2%. The error is:",o:["Rounding","The minimum is a floor, not an addition","Using the wrong CPI","The floating rate should be doubled"],a:1,e:"You use the higher of the two, never their sum."},
{t:"L1",q:"You hold an iBond to maturity. The amount of principal you receive is:",o:["Indexed to the CPI","100% of the face value as a nominal amount","Equal to accumulated interest","The floating rate"],a:1,e:"Only the interest is inflation-linked; principal is repaid at 100% nominal."},
{t:"L1",q:"An iBond's interest is paid:",o:["Monthly","Quarterly","Twice a year","Only at maturity"],a:2,e:"Interest is paid semi-annually, though rates are quoted annually."},
{t:"L1",q:"The minimum subscription amount for an iBond is:",o:["HK$1,000","HK$10,000","HK$50,000","HK$100,000"],a:1,e:"The minimum denomination is HK$10,000."},
{t:"L1",q:"You want to sell your iBond before maturity. You can:",o:["Only redeem it with the government","Trade it on the Stock Exchange of Hong Kong","Only transfer it to family","Not sell it at all"],a:1,e:"iBonds are listed and can be traded on the SEHK."},
{t:"L1",q:"Inflation turns negative and the six-month average is −0.5%, with a 1% floor. Your iBond pays:",o:["−0.5%","0%","1.00%","0.5%"],a:2,e:"The floor protects you from deflation on the interest rate."},
{t:"L1",q:"Inflation is running at 4% and the floating rate is 4.1%. Compared with a fixed 2% deposit, the iBond pays:",o:["Less","More","The same","Nothing"],a:1,e:"The iBond tracks inflation; the fixed deposit pays only 2%."},
{t:"L1",q:"The floating rate averages to 2.4% and the minimum is 2%. The iBond pays:",o:["4.4%","2.40%","2.00%","0.40%"],a:1,e:"The floating rate exceeds the floor, so 2.40% applies."},
{t:"L1",q:"An iBond's interest protects you against inflation, but its principal:",o:["Also grows with the CPI","Remains a nominal amount","Is paid in shares","Equals the interest"],a:1,e:"Principal is nominal; only interest is inflation-linked."},
{t:"L1",q:"The 2020 iBond issue compared the floating rate with a minimum of:",o:["1% per year","2% per year","2% per month","0%"],a:1,e:"The 2020 issue had a 2% annual minimum."},
{t:"L1",q:"Earlier iBond issues described in the supplement had a minimum of:",o:["2%","3%","1%","0.5%"],a:2,e:"Earlier issues used a 1% minimum."},
{t:"L1",q:"The six monthly changes are 0.6, 0.8, 1.0, 1.2, 1.4 and 1.6 (%), with a 2% minimum. The rate used is:",o:["1.10%","2.00%","3.10%","1.00%"],a:1,e:"The average is 1.10%, below the floor, so 2.00% applies."},

/* ==================== LECTURE 2 — CLASSIFICATION SCENARIOS ==================== */
{t:"L2",q:"Kenji worked 22 hours last week. He wanted full-time work, the café had none, he checked job boards twice in the past month and could start more work immediately. He is:",o:["Unemployed","Employed but not underemployed","Employed and underemployed","Outside the labour force"],a:2,e:"Under 35 hours, involuntary, and available/seeking — he is underemployed and still in the labour force."},
{t:"L2",q:"Mei worked 22 hours last week by choice so she could pursue a hobby. She did not seek or want more work. She is:",o:["Underemployed","Unemployed","Employed but not underemployed","Outside the labour force"],a:2,e:"The shortfall must be involuntary. Voluntary part-time work is simply employment."},
{t:"L2",q:"Sam worked 30 hours involuntarily but neither sought nor was available for more work because he was caring for a sick parent. He is:",o:["Underemployed","Employed but not underemployed","Unemployed","Outside the labour force"],a:1,e:"The seeking-or-available condition fails, so he is employed but not underemployed."},
{t:"L2",q:"Priya has no job, is available, and stopped applying three months ago because she believes no vacancies exist. Under Hong Kong definitions she is:",o:["Outside the labour force","Unemployed and in the labour force","Underemployed","Employed"],a:1,e:"Hong Kong explicitly counts discouraged workers as unemployed."},
{t:"L2",q:"Daniel has no job and is available. He has not searched because he has arranged to start a new job next month. He is:",o:["Outside the labour force","Employed","Unemployed under Hong Kong definitions","Underemployed"],a:2,e:"The 'arranged to start a job later' exception counts him as unemployed."},
{t:"L2",q:"Aisha is jobless. She had been actively searching but was in hospital during the enumeration week. She is:",o:["Outside the labour force","Unemployed under Hong Kong definitions","Employed","Underemployed"],a:1,e:"Sickness making a searcher temporarily unavailable does not remove unemployed status."},
{t:"L2",q:"Mr Chan is 68, retired, does not want work and has not looked. He is:",o:["Unemployed","Underemployed","Outside the labour force","Employed"],a:2,e:"He is neither employed nor unemployed, so he is outside the labour force."},
{t:"L2",q:"Lily is a full-time student who works 12 paid hours a week at a bookshop. She is:",o:["Outside the labour force because she is a student","Employed and in the labour force","Underemployed","Unemployed"],a:1,e:"Labels such as 'student' are irrelevant. Paid work means employed."},
{t:"L2",q:"A 14-year-old helps at the family shop on weekends. In Hong Kong labour statistics he is:",o:["Employed","Unemployed","Outside the labour force, since the reference population is aged 15+","Underemployed"],a:2,e:"The reference population starts at age 15."},
{t:"L2",q:"A person serving a prison sentence is:",o:["In the labour force","Excluded because the population is land-based and non-institutional","Unemployed","Underemployed"],a:1,e:"Institutional populations are outside the reference population."},
{t:"L2",q:"Tom works 20 hours involuntarily and searched for extra work in the past 30 days. Which statement is FALSE?",o:["He is underemployed","He is counted as employed","He is in the labour force","He is counted as unemployed"],a:3,e:"Underemployment and unemployment are mutually exclusive. He is employed."},
{t:"L2",q:"A full-time worker loses his job and takes a 15-hour part-time job while still searching full-time. Compared with before:",o:["The unemployment rate falls and underemployment may rise","The unemployment rate rises","Both rates fall","Participation rises"],a:0,e:"He moves from unemployed to employed but is involuntarily under 35 hours."},
{t:"L2",q:"Forty unemployed people stop searching because they believe no jobs exist. In Hong Kong this means:",o:["They leave the labour force","They remain unemployed, so nothing changes here","They become employed","They become underemployed"],a:1,e:"Hong Kong already counts discouraged workers as unemployed."},
{t:"L2",q:"Which person is definitely NOT in the labour force?",o:["A discouraged worker available for work","A jobless person expecting to return to their old job","A person unavailable for work because of full-time childcare","A person on paid holiday from their job"],a:2,e:"Unavailability removes them from the labour force. The others are inside."},
{t:"L2",q:"A person is jobless, available, has not searched, and expects to return to their original job. They are:",o:["Outside the labour force","Unemployed under Hong Kong definitions","Employed","Underemployed"],a:1,e:"This is an explicit Hong Kong exception."},
{t:"L2",q:"A worker on paid holiday during the survey week is:",o:["Unemployed","Employed","Outside the labour force","Underemployed"],a:1,e:"Temporary absence from an existing job is still employment."},
{t:"L2",q:"A part-time worker who chose her hours to study is:",o:["Underemployed","Unemployed","Employed but not underemployed","Outside the labour force"],a:2,e:"Voluntary part-time work does not meet the involuntary condition."},
{t:"L2",q:"A worker involuntarily works exactly 35 hours and wants more. He is:",o:["Underemployed","Employed and not underemployed, since the rule is 'less than 35 hours'","Unemployed","Outside the labour force"],a:1,e:"Exactly 35 hours does not satisfy the threshold."},
{t:"L2",q:"A worker involuntarily works 34 hours and is available for more work. He is:",o:["Underemployed","Not underemployed because 34 is close to 35","Unemployed","Outside the labour force"],a:0,e:"Below 35 plus availability satisfies the rule."},
{t:"L2",q:"A worker involuntarily works 20 hours and is available for more work but did not search. He is:",o:["Underemployed, because availability alone satisfies the OR condition","Employed but not underemployed","Unemployed","Outside the labour force"],a:0,e:"The condition is 'sought OR available', so availability is enough."},
{t:"L2",q:"A worker involuntarily works 20 hours and searched for more work but was not available this week. He is:",o:["Underemployed, because searching alone satisfies the OR condition","Employed but not underemployed","Unemployed","Outside the labour force"],a:0,e:"Searching satisfies the OR condition, so he is underemployed."},
{t:"L2",q:"A worker voluntarily works 40 hours but wants 50. He is:",o:["Underemployed","Unemployed","Employed and not underemployed","Outside the labour force"],a:2,e:"He is above the 35-hour threshold and the shortfall is voluntary."},
{t:"L2",q:"A graduate spends a year travelling and is not seeking work. She is:",o:["Unemployed","Outside the labour force","Underemployed","Employed"],a:1,e:"Not available or seeking, so outside the labour force."},
{t:"L2",q:"A person volunteers at a charity for no pay and is not seeking paid work. He is:",o:["Employed","Unemployed","Outside the labour force","Underemployed"],a:2,e:"Unpaid voluntary work is not employment in the labour force definition."},
{t:"L2",q:"A worker on unpaid leave but still holding her job is:",o:["Unemployed","Employed","Outside the labour force","Underemployed"],a:1,e:"A job attachment means employment, even during unpaid leave."},
{t:"L2",q:"A foreign domestic helper working in Hong Kong is:",o:["Outside the labour force","Employed and in the labour force","Unemployed","Underemployed"],a:1,e:"Paid work means employed, regardless of nationality."},
{t:"L2",q:"A retiree who has started actively looking for part-time work is:",o:["Outside the labour force","Unemployed","Employed","Underemployed"],a:1,e:"Searching and available makes them unemployed, whatever their age label."},
{t:"L2",q:"A person working 3 paid hours a week who wants more hours and has searched is:",o:["Employed but not underemployed","Underemployed","Unemployed","Outside the labour force"],a:1,e:"Under 35 hours, involuntary, and searching — underemployed."},
{t:"L2",q:"Which statement about an underemployed person is TRUE?",o:["They are excluded from the labour force","They are counted as unemployed","They are employed and remain in the labour force","They are outside the labour force"],a:2,e:"Underemployment is a subset of employment, the most common confusion in the topic."},
{t:"L2",q:"A person who had a job offer and starts next month but is not yet working is:",o:["Outside the labour force","Unemployed under Hong Kong definitions","Employed","Underemployed"],a:1,e:"The arranged-start exception counts them as unemployed."},
{t:"L2",q:"A discouraged worker who later becomes unavailable for work is:",o:["Still unemployed","Outside the labour force","Employed","Underemployed"],a:1,e:"Availability is required; without it they leave the labour force."},
{t:"L2",q:"Which person is inside the labour force?",o:["A retiree not seeking work","A homemaker not seeking work","A discouraged worker who is available for work","A full-time student not seeking work"],a:2,e:"Hong Kong counts discouraged workers as unemployed, so they are in the labour force."},
{t:"L2",q:"A worker loses her job and immediately starts searching. She is:",o:["Outside the labour force","Unemployed","Employed","Underemployed"],a:1,e:"No job, available, and searching — unemployed."},
{t:"L2",q:"A person doing 25 hours involuntarily, who searched last week and could start immediately, is:",o:["Unemployed","Employed and underemployed","Outside the labour force","Employed but not underemployed"],a:1,e:"All three underemployment conditions are met."},

/* ==================== LECTURE 2 — RATES ==================== */
{t:"L2",q:"A small town has a labour force of 2,000 and 100 unemployed. The unemployment rate is:",o:["4%","5%","10%","2%"],a:1,e:"100/2,000 = 5%."},
{t:"L2",q:"Employment is 1,900 and unemployment is 100. The unemployment rate is:",o:["5%","5.26%","4.76%","10%"],a:0,e:"Labour force = 2,000, so 100/2,000 = 5%. Dividing by employment gives the 5.26% trap."},
{t:"L2",q:"A city has 4,000 people aged 15+ and a labour force of 2,500. The participation rate is:",o:["62.5%","40%","160%","6.25%"],a:0,e:"2,500/4,000 = 62.5%."},
{t:"L2",q:"In a district, 60 people are underemployed and the labour force is 2,000. The underemployment rate is:",o:["3%","3.16%","1.5%","6%"],a:0,e:"60/2,000 = 3%. The denominator is the labour force."},
{t:"L2",q:"In the same district, employment is 1,900 and 60 are underemployed. Dividing 60 by employment gives 3.16%. Why is this wrong?",o:["It is not wrong","The denominator must be the labour force, not employment","Underemployment uses the population","It should be divided by 1,960"],a:1,e:"Both unemployment and underemployment rates use the labour force as denominator."},
{t:"L2",q:"Thirty unemployed people find jobs and the labour force is unchanged. The unemployment rate:",o:["Rises","Falls","Is unchanged","Becomes zero"],a:1,e:"The numerator shrinks while the denominator stays put."},
{t:"L2",q:"Fifty people outside the labour force start actively searching. The labour force:",o:["Falls","Is unchanged","Rises","Doubles"],a:2,e:"They enter the labour force as unemployed."},
{t:"L2",q:"Fifty unemployed people give up and become unavailable for work. The labour force:",o:["Rises","Falls","Is unchanged","Doubles"],a:1,e:"They leave the labour force entirely."},
{t:"L2",q:"Fifty underemployed workers move into full-time jobs. The labour force:",o:["Falls","Is unchanged","Rises","Doubles"],a:1,e:"They were already employed, so membership does not change."},
{t:"L2",q:"Twenty outside the labour force start searching. What happens to the unemployment rate?",o:["It necessarily falls","It may rise, because they enter as unemployed","It is unchanged","It becomes zero"],a:1,e:"Both numerator and denominator increase, so the rate can rise."},
{t:"L2",q:"If the population aged 15+ rises but the labour force is unchanged, the participation rate:",o:["Rises","Falls","Is unchanged","Doubles"],a:1,e:"A larger denominator with a constant numerator lowers the rate."},
{t:"L2",q:"If the labour force grows faster than employment, the unemployment rate:",o:["Falls","Rises","Is unchanged","Becomes zero"],a:1,e:"Unemployment grows relative to the labour force."},
{t:"L2",q:"A city has 90 unemployed and 1,710 employed. The unemployment rate is:",o:["5%","5.26%","4.5%","9%"],a:0,e:"LF = 1,800, so 90/1,800 = 5%."},
{t:"L2",q:"Employment is 1,425, unemployment 75, underemployment 45, population 2,400. Which triple is right?",o:["Participation 62.5%, unemployment 5%, underemployment 3%","Participation 60%, unemployment 5%, underemployment 3%","Participation 62.5%, unemployment 5.26%, underemployment 3.16%","Participation 62.5%, unemployment 3%, underemployment 5%"],a:0,e:"LF = 1,500; 1,500/2,400 = 62.5%; 75/1,500 = 5%; 45/1,500 = 3%."},
{t:"L2",q:"An unemployed person takes a job. Which rate definitely falls?",o:["The participation rate","The unemployment rate","The underemployment rate","The population"],a:1,e:"The unemployment numerator shrinks; the participation rate is unchanged."},
{t:"L2",q:"An employed person becomes unemployed. The participation rate:",o:["Rises","Falls","Is unchanged","Doubles"],a:2,e:"They stay inside the labour force, so the participation rate does not move."},
{t:"L2",q:"A worker moves from 20 hours to 40 hours a week. Which rate is most directly affected?",o:["The unemployment rate","The underemployment rate","The participation rate","The population growth rate"],a:1,e:"He leaves underemployment; he was never unemployed."},
{t:"L2",q:"Which change leaves the participation rate unchanged?",o:["An unemployed person finds work","A person outside the labour force starts searching","A student graduates and starts looking for work","A worker retires and stops looking"],a:0,e:"Only movements across the labour force boundary change the participation rate."},
{t:"L2",q:"Labour force 3,000, population aged 15+ 5,000, unemployed 150. Participation and unemployment rates are:",o:["60% and 5%","60% and 5.26%","50% and 5%","62.5% and 3%"],a:0,e:"3,000/5,000 = 60%; 150/3,000 = 5%."},
{t:"L2",q:"A person outside the labour force starts a job directly. The participation rate:",o:["Falls","Rises","Is unchanged","Becomes zero"],a:1,e:"They enter the labour force as employed, raising both numerator and participation."},

/* ==================== LECTURE 2 — TYPES OF UNEMPLOYMENT ==================== */
{t:"L2",q:"A worker quits to relocate to another district and searches for a local job. This is:",o:["Structural unemployment","Cyclical unemployment","Frictional unemployment","Outside the labour force"],a:2,e:"Voluntary short-term search while matching is frictional."},
{t:"L2",q:"A printing technician's skills no longer match digital-publishing jobs. This is:",o:["Frictional unemployment","Structural unemployment","Cyclical unemployment","Underemployment"],a:1,e:"Persistent skill mismatch at normal output is structural."},
{t:"L2",q:"Hotels lay off staff because a recession reduces bookings. This is:",o:["Frictional unemployment","Structural unemployment","Cyclical unemployment","The natural rate"],a:2,e:"Recession-driven layoffs are cyclical."},
{t:"L2",q:"A fresh graduate spends two months applying for jobs. This is:",o:["Structural unemployment","Cyclical unemployment","Frictional unemployment","Outside the labour force"],a:2,e:"Short-term search while matching is frictional."},
{t:"L2",q:"New arrivals cannot find work because of language barriers. This is:",o:["Frictional","Structural","Cyclical","Seasonal"],a:1,e:"Language barriers are a structural cause."},
{t:"L2",q:"A factory installs robots and lays off assembly workers who cannot do other jobs. This is:",o:["Frictional","Structural","Cyclical","The natural rate"],a:1,e:"Automation creating persistent skill mismatch is structural."},
{t:"L2",q:"A construction slowdown during a recession leaves builders idle. This is:",o:["Frictional","Structural","Cyclical","Voluntary"],a:2,e:"Recession-related job loss is cyclical."},
{t:"L2",q:"Discrimination against a group of jobseekers contributes to:",o:["Frictional unemployment","Structural unemployment","Cyclical unemployment","Underemployment only"],a:1,e:"Discrimination is listed as a structural cause."},
{t:"L2",q:"At full employment, which unemployment types remain?",o:["Only cyclical","Frictional and structural","Only structural","None"],a:1,e:"Full employment means no cyclical unemployment only."},
{t:"L2",q:"During an economic boom, cyclical unemployment is:",o:["Positive","Zero","Negative","Undefined"],a:2,e:"Output above potential means u below u*, so cyclical unemployment is negative."},
{t:"L2",q:"Which statement about full employment is correct?",o:["Unemployment is zero","Search and structural unemployment can still exist","Only cyclical unemployment exists","The participation rate is 100%"],a:1,e:"Full employment is zero cyclical unemployment, not zero unemployment."},
{t:"L2",q:"Job search that takes time is beneficial because:",o:["It raises the CPI","It improves job matches in a dynamic economy","It lowers potential output","It increases the natural rate"],a:1,e:"Better matches are the social benefit of search unemployment."},
{t:"L2",q:"Which is NOT one of the three unemployment types in the lecture?",o:["Frictional","Structural","Cyclical","Seasonal"],a:3,e:"The lecture covers frictional, structural and cyclical only."},
{t:"L2",q:"A worker laid off in a recession and searching for work is:",o:["Frictionally unemployed","Cyclically unemployed","Structurally unemployed","Outside the labour force"],a:1,e:"Recession-driven job loss is cyclical, even while searching."},
{t:"L2",q:"A firm's industry disappears permanently because of technological change. The resulting unemployment is:",o:["Frictional","Cyclical","Structural","Voluntary"],a:2,e:"Permanent mismatch is structural."},

/* ==================== LECTURE 2 — GAPS & PHILLIPS ==================== */
{t:"L2",q:"Potential output is $1,000 and actual output is $950. The economy has:",o:["An expansionary gap of 50","A recessionary gap of 50","A zero gap","A negative output gap"],a:1,e:"Y* − Y = +50, a positive (recessionary) gap."},
{t:"L2",q:"Potential output is $1,000 and actual output is $1,050. The output gap Y* − Y is:",o:["+50","−50","0","100"],a:1,e:"1,000 − 1,050 = −50, an expansionary gap."},
{t:"L2",q:"Actual unemployment is 6.2% and the natural rate is 4.5%. Cyclical unemployment is:",o:["+1.7 percentage points","−1.7 percentage points","10.7 percentage points","Zero"],a:0,e:"6.2 − 4.5 = +1.7, consistent with a recessionary gap."},
{t:"L2",q:"Actual unemployment is 3.8% and the natural rate is 4.5%. The economy is likely:",o:["In a recessionary gap","In an expansionary gap","At full employment","With zero frictional unemployment"],a:1,e:"u below u* means output above potential."},
{t:"L2",q:"A student says 'the output gap is Y − Y*.' Why does this matter?",o:["It gives the same sign","It flips the sign, so recessionary gaps look positive","It is undefined","It equals cyclical unemployment"],a:1,e:"The lecture defines the gap as Y* − Y, so the sign matters."},
{t:"L2",q:"In an expansionary gap, excess demand:",o:["Puts downward pressure on prices","Puts upward pressure on prices","Leaves prices unchanged","Causes deflation"],a:1,e:"Output above potential creates inflationary pressure."},
{t:"L2",q:"In a recessionary gap:",o:["Capital and labour are underused","Output is above normal","Unemployment is below the natural rate","Prices are falling fast"],a:0,e:"Resources are underused when actual output is below potential."},
{t:"L2",q:"If actual output equals potential output, then:",o:["u is above u*","u equals u* and cyclical unemployment is zero","u is below u*","Unemployment is zero"],a:1,e:"At normal output the actual rate equals the natural rate."},
{t:"L2",q:"Along the short-run Phillips curve in the lecture, lower inflation is associated with:",o:["Lower unemployment","Higher unemployment","No change in unemployment","Higher potential output"],a:1,e:"The short-run trade-off runs the other way from higher inflation."},
{t:"L2",q:"Which statement about the Phillips curve is correct?",o:["It is a permanent long-run rule","It is a short-run trade-off, not an unconditional relationship","It links GDP and the CPI","It measures potential output"],a:1,e:"The lecture stresses that it is a short-run relationship."},
{t:"L2",q:"Which is NOT part of the natural rate of unemployment?",o:["Frictional unemployment","Structural unemployment","Cyclical unemployment","Job-search unemployment"],a:2,e:"The natural rate excludes the cyclical component."},
{t:"L2",q:"A student says 'Y* is the maximum the economy can ever produce.' The error is that:",o:["Y* is actual output","Y* uses resources at normal rates, not maximum rates","Y* is nominal GDP","Y* equals u*"],a:1,e:"Potential output is based on normal utilisation, not a physical maximum."},
{t:"L2",q:"If actual unemployment equals the natural rate, the output gap is:",o:["Positive","Negative","Zero","Undefined"],a:2,e:"u = u* corresponds to Y = Y*."},
{t:"L2",q:"During an overheating boom, unemployment is:",o:["Above the natural rate","Below the natural rate","Equal to the natural rate","Zero"],a:1,e:"Overheating means output above potential and u below u*."},
{t:"L2",q:"Potential output rises but actual output stays the same. The economy:",o:["Moves toward an expansionary gap","Moves toward a recessionary gap","Stays at full employment","Has zero cyclical unemployment"],a:1,e:"Y* rises while Y does not, so the positive gap widens."},
{t:"L2",q:"In a recessionary gap, the unemployment rate is:",o:["Below the natural rate","Above the natural rate","Equal to the natural rate","Zero"],a:1,e:"Output below potential means labour is underused."},
{t:"L2",q:"Full-employment output is another name for:",o:["Nominal GDP","Actual output Y","Potential output Y*","The output gap"],a:2,e:"Y* is also called potential real GDP or full-employment output."},
{t:"L2",q:"If Y > Y*, then u − u* is:",o:["Positive","Negative","Zero","Undefined"],a:1,e:"Output above potential means unemployment below the natural rate."},
{t:"L2",q:"A recession pushes output 5% below potential. Which is most consistent?",o:["Unemployment below the natural rate","Unemployment above the natural rate","Zero cyclical unemployment","An expansionary gap"],a:1,e:"A recessionary gap raises unemployment above u*."},
{t:"L2",q:"The short-run Phillips curve links:",o:["GDP and the CPI","Inflation and unemployment","Nominal and real interest","Exports and imports"],a:1,e:"It relates inflation to unemployment in the short run."},

/* ==================== LECTURE 3 — PRODUCTION & VALUE ADDED ==================== */
{t:"L3",q:"You buy a newly made desk from a local carpenter. This counts in GDP as:",o:["Nothing","Current domestic production","A transfer","Inventory investment"],a:1,e:"A newly produced final good sold to a household is current output."},
{t:"L3",q:"You resell your old economics textbook to a junior student. This counts in GDP as:",o:["Consumption","Nothing, because it is not current production","Investment","A service"],a:1,e:"Resales of existing goods are excluded."},
{t:"L3",q:"An agent earns a $50,000 commission on the sale of an existing flat. GDP includes:",o:["The full flat price","The $50,000 commission only","Nothing","The flat price minus the commission"],a:1,e:"The flat is not new production, but the agent's service is."},
{t:"L3",q:"You buy shares in a listed company. This counts in GDP as:",o:["Investment","Nothing, since it is a transfer of ownership of a financial asset","Consumption","Net exports"],a:1,e:"Share trades do not create current output."},
{t:"L3",q:"The government pays you a $5,000 pension. This counts in GDP as:",o:["Government purchases","Nothing, because it is a transfer payment","Consumption","Investment"],a:1,e:"Transfers are excluded from government purchases and GDP."},
{t:"L3",q:"A foreign-owned firm produces furniture in Hong Kong. This output is:",o:["In the foreign country's GDP only","Part of Hong Kong GDP","Excluded from both","Counted as imports"],a:1,e:"GDP uses production location, not ownership."},
{t:"L3",q:"A Hong Kong firm builds a factory in Shenzhen. The factory's output is:",o:["Part of Hong Kong GDP","Part of Shenzhen's GDP","Part of both equally","Excluded entirely"],a:1,e:"Production abroad belongs to the host economy's GDP."},
{t:"L3",q:"A desk is produced in 2026 but sold in 2027. It counts in:",o:["2027 GDP","2026 GDP as inventory investment","Both years","Neither year"],a:1,e:"GDP uses the time of production, and unsold output is inventory investment."},
{t:"L3",q:"A firm's revenue is $500 and purchased inputs are $200. Value added is:",o:["$500","$300","$700","$200"],a:1,e:"500 − 200 = $300."},
{t:"L3",q:"A firm's revenue is $800 and inputs are $500. Value added is:",o:["$800","$500","$300","$1,300"],a:2,e:"800 − 500 = $300."},

{t:"L3",q:"Timber worth $200 is produced in 2025 and the finished desk in 2026. How much enters 2026 GDP?",o:["$800","$500","Only the 2026 value added","$1,500"],a:2,e:"The timber already entered 2025 GDP; only new 2026 value added counts."},
{t:"L3",q:"A bakery buys flour to make bread. The flour is:",o:["A final good","An intermediate good, not counted separately","A capital good","An export"],a:1,e:"Intermediate inputs are counted inside the final good's value."},
{t:"L3",q:"Which is a final good?",o:["Steel bought by a car maker","Flour bought by a bakery","A car bought by a household","Timber bought by a workshop"],a:2,e:"The other three are inputs purchased by firms."},
{t:"L3",q:"You buy an imported television. The effect on GDP is:",o:["Consumption rises and GDP rises","Consumption rises but imports rise by the same amount, so GDP is unchanged","Net exports rise","Investment rises"],a:1,e:"C rises but the import subtracts from NX, offsetting it."},
{t:"L3",q:"A firm builds a new factory. This is:",o:["Consumption","Business fixed investment","Inventory investment","Government purchases"],a:1,e:"New plant and equipment by firms is business fixed investment."},
{t:"L3",q:"A firm produces goods it cannot sell this year. These count as:",o:["Nothing","Inventory investment","Consumption","Net exports"],a:1,e:"Unsold output is inventory investment in the year produced."},
{t:"L3",q:"Inventories fall from 100 to 70 over the year. Inventory investment is:",o:["+30","−30","+100","−100"],a:1,e:"Only the change counts, and a fall is negative investment."},

{t:"L3",q:"Hong Kong-made goods sold to a foreign buyer count as:",o:["Imports","Exports and raise GDP","Consumption","Inventory"],a:1,e:"Exports are domestically produced and sold abroad, adding to NX."},

{t:"L3",q:"You pay a professional to renovate your kitchen. This counts as:",o:["Nothing","A current service included in GDP","Investment","A transfer"],a:1,e:"The renovation service is newly produced this period."},
{t:"L3",q:"A second-hand car dealer sells a used car for $80,000 and earns a $6,000 commission. GDP includes:",o:["$80,000","$6,000","$86,000","Nothing"],a:1,e:"Only the dealer's service is current output."},
{t:"L3",q:"A firm buys steel to make washing machines. The steel is:",o:["Counted separately in GDP","Intermediate, counted inside the washing machines","A final good","Investment"],a:1,e:"Counting it separately would double count."},

{t:"L3",q:"A tourist from Japan spends money in a Hong Kong hotel. This counts as:",o:["An import","An export of services, raising GDP","A transfer","Nothing"],a:1,e:"Foreign spending on domestic services is an export."},
{t:"L3",q:"A Hong Kong resident holidays in Thailand. This counts as:",o:["An export","An import, reducing net exports","Consumption only","Nothing"],a:1,e:"Spending abroad on foreign services is an import."},

/* ==================== LECTURE 3 — EXPENDITURE APPROACH ==================== */
{t:"L3",q:"C = 1,100, I = 430, G = 250 and NX = 20. GDP is:",o:["1,780","1,800","1,820","1,750"],a:1,e:"1,100 + 430 + 250 + 20 = 1,800."},
{t:"L3",q:"Business fixed investment is 180, new housing 220 and inventories rise from 70 to 100. Investment I is:",o:["400","430","500","470"],a:1,e:"180 + 220 + 30 = 430. Using the ending stock of 100 would be wrong."},

{t:"L3",q:"A Hong Kong resident buys a Japanese camera. This affects GDP by:",o:["Raising C and lowering NX equally, so no change","Raising GDP","Lowering GDP by the full price","Raising investment"],a:0,e:"Consumption rises but the import offsets it in net exports."},
{t:"L3",q:"Which of these counts as investment in GDP?",o:["Buying shares","Buying an existing house","Building a new factory","Paying a pension"],a:2,e:"Only new productive capital is investment."},

/* ==================== LECTURE 3 — REAL VS NOMINAL ==================== */
{t:"L3",q:"Real GDP values output using:",o:["Current-year prices","Base-year prices","The CPI basket","The GDP deflator"],a:1,e:"Real GDP holds prices fixed at base-year levels."},
{t:"L3",q:"Nominal GDP values output using:",o:["Base-year prices","Current-year prices","Constant prices","The labour force"],a:1,e:"Nominal GDP uses the prices prevailing in the year measured."},
{t:"L3",q:"In the base year:",o:["Real GDP exceeds nominal GDP","Real GDP equals nominal GDP","Nominal GDP is zero","The deflator is zero"],a:1,e:"With base-year prices the two are identical."},
{t:"L3",q:"2025: 10 desks at $800 and 20 sessions at $200. 2026: 12 desks at $900 and 24 sessions at $250. Nominal GDP in 2026 is:",o:["$14,400","$16,800","$12,000","$15,000"],a:1,e:"12×900 + 24×250 = 10,800 + 6,000 = $16,800."},
{t:"L3",q:"Using the same data, real GDP in 2026 at 2025 prices is:",o:["$16,800","$14,400","$12,000","$15,000"],a:1,e:"12×800 + 24×200 = 9,600 + 4,800 = $14,400."},
{t:"L3",q:"Using the same data, nominal GDP growth from 2025 to 2026 is:",o:["20%","40%","16.8%","12%"],a:1,e:"16,800/12,000 − 1 = 40%."},
{t:"L3",q:"Using the same data, real GDP growth is:",o:["20%","40%","16.8%","25%"],a:0,e:"14,400/12,000 − 1 = 20%."},
{t:"L3",q:"Using the same data, the GDP deflator in 2026 is about:",o:["116.7","85.7","1.167%","144"],a:0,e:"(16,800/14,400) × 100% = 116.7%."},
{t:"L3",q:"If prices double and quantities are unchanged:",o:["Nominal and real GDP both double","Nominal GDP doubles but real GDP is unchanged","Real GDP doubles but nominal is unchanged","Neither changes"],a:1,e:"Real GDP uses base-year prices, so it does not react to the price change."},
{t:"L3",q:"If quantities double and prices are unchanged:",o:["Only real GDP doubles","Only nominal GDP doubles","Both double","Neither changes"],a:2,e:"More output raises both measures equally when prices are fixed."},
{t:"L3",q:"If real GDP rises while nominal GDP is unchanged, prices must have:",o:["Risen","Fallen","Stayed the same","Doubled"],a:1,e:"Nominal = real × price level, so falling prices can offset higher output."},
{t:"L3",q:"If nominal GDP is $24,000 and the deflator is 120, real GDP is:",o:["$20,000","$28,800","$2,000","$22,800"],a:0,e:"24,000/1.20 = $20,000."},
{t:"L3",q:"If real GDP is $10,000 and the deflator is 110, nominal GDP is:",o:["$9,090","$11,000","$10,110","$1,100"],a:1,e:"10,000 × 1.10 = $11,000."},
{t:"L3",q:"Real GDP rises 5% and the deflator rises 2%. Nominal GDP rises about:",o:["3%","7%","10%","2.5%"],a:1,e:"Nominal growth ≈ 5 + 2 = 7%."},
{t:"L3",q:"Nominal GDP rises 10% and the deflator rises 4%. Real GDP rises about:",o:["14%","6%","5.8%","2.5%"],a:2,e:"1.10/1.04 = 1.0577, about 5.8%."},
{t:"L3",q:"The CPI fixes quantities to compare prices, while real GDP:",o:["Fixes prices to compare quantities","Fixes quantities to compare prices","Uses current prices","Ignores quantities"],a:0,e:"Real GDP holds prices fixed and lets quantities vary."},
{t:"L3",q:"A country's output is unchanged but all its prices fall. Real GDP:",o:["Falls","Is unchanged","Rises","Doubles"],a:1,e:"Real GDP depends on quantities at fixed prices."},
{t:"L3",q:"Which statement about the GDP deflator is correct?",o:["It is an inflation rate","It is an index level with the base year at 100%","It equals the CPI","It includes imports"],a:1,e:"You must take its percentage change to get inflation."},
{t:"L3",q:"A price increase with no change in quantities leaves:",o:["Real GDP unchanged but nominal GDP higher","Both unchanged","Nominal GDP unchanged","Real GDP higher"],a:0,e:"Only the nominal value responds to prices."},
{t:"L3",q:"GDP measured in current dollars is:",o:["Real GDP","Nominal GDP","The GDP deflator","Potential output"],a:1,e:"Current-dollar value is the nominal measure."},
{t:"L3",q:"If nominal GDP rises 8% and real GDP rises 8%, the deflator:",o:["Rises 8%","Is unchanged","Falls 8%","Rises 16%"],a:1,e:"Equal growth leaves the ratio unchanged."},

{t:"L3",q:"A country's real GDP grows 3% while its population grows 5%. Output per person:",o:["Rises","Falls","Is unchanged","Doubles"],a:1,e:"Output grows more slowly than population, so per-person output falls."},
{t:"L3",q:"Which is true in the base year?",o:["Nominal GDP exceeds real GDP","The deflator equals 100%","Real GDP is zero","The CPI equals zero"],a:1,e:"Base-year prices make the deflator 100%."},

{t:"L3",q:"Two countries have identical real GDP per head, but one has much more free time. GDP:",o:["Captures this difference","Does not capture differences in leisure time","Rises with leisure","Falls with leisure"],a:1,e:"Leisure is one of the well-being dimensions GDP ignores."},

{t:"L3",q:"Cooking at home rather than eating out causes measured GDP to:",o:["Rise","Fall, since a market service becomes nonmarket production","Stay the same","Double"],a:1,e:"The restaurant meal was counted; the home-cooked meal is not."}

/* ================= RENDER ================= */
const quiz=document.getElementById('quiz');
const sAns=document.getElementById('sAns'), sCor=document.getElementById('sCor'),
      sAcc=document.getElementById('sAcc'), sTot=document.getElementById('sTot'),
      progress=document.getElementById('progress');
const L=['A','B','C','D'];
let answered=0, correct=0;
sTot.textContent=QUESTIONS.length;

function card(q,i){
  const d=document.createElement('div');
  d.className='qcard';
  d.dataset.topic=q.t;

  const head=document.createElement('div'); head.className='qhead';
  head.innerHTML='<span class="qnum">Q'+(i+1)+'</span><span class="qtag '+q.t+'">'+q.t+'</span>';
  const tx=document.createElement('div'); tx.className='qtext'; tx.textContent=q.q;
  head.appendChild(tx); d.appendChild(head);

  const box=document.createElement('div'); box.className='opts';
  q.o.forEach((txt,j)=>{
    const b=document.createElement('button');
    b.type='button'; b.className='opt';
    b.innerHTML='<span class="letter">'+L[j]+'</span><span>'+txt+'</span>';
    b.addEventListener('click',()=>pick(d,q,j,b,box));
    box.appendChild(b);
  });
  d.appendChild(box);

  const ex=document.createElement('div'); ex.className='explain';
  ex.innerHTML='<b>Answer: '+L[q.a]+'.</b> '+q.e;
  d.appendChild(ex);
  return d;
}

function pick(d,q,picked,btn,box){
  if(d.dataset.done==='1') return;
  d.dataset.done='1';
  box.querySelectorAll('.opt').forEach((b,j)=>{
    b.classList.add('done'); b.disabled=true;
    if(j===q.a) b.classList.add('correct');
  });
  if(picked!==q.a) btn.classList.add('wrong');
  d.querySelector('.explain').classList.add('show');
  answered++; if(picked===q.a) correct++;
  stats();
}

function stats(){
  sAns.textContent=answered; sCor.textContent=correct;
  sAcc.textContent=answered===0?'—':(Math.round(correct/answered*1000)/10)+'%';
  progress.style.width=(answered/QUESTIONS.length*100)+'%';
}

QUESTIONS.forEach((q,i)=>quiz.appendChild(card(q,i)));

document.querySelectorAll('.filters button').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    const f=b.dataset.f;
    document.querySelectorAll('.qcard').forEach(c=>{
      c.classList.toggle('hidden', f!=='all' && c.dataset.topic!==f);
    });
    window.scrollTo({top:0,behavior:'smooth'});
  });
});

document.getElementById('resetBtn').addEventListener('click',()=>{
  if(!confirm('Reset all answers and your score?')) return;
  answered=0; correct=0;
  document.querySelectorAll('.qcard').forEach(c=>{
    c.dataset.done='0';
    c.querySelectorAll('.opt').forEach(b=>{
      b.classList.remove('correct','wrong','done'); b.disabled=false;
    });
    c.querySelector('.explain').classList.remove('show');
  });
  stats();
  window.scrollTo({top:0,behavior:'smooth'});
});

stats();
</script>
</body>
</html>
